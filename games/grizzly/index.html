  //  A daily limit: 20 minutes unless a grown-up changes it with the gear button on the menu
  //  (behind a times-table check). Time counts only while a game is open and the page is
  //  visible, and is saved per day, so reopening the game doesn't reset it. At one minute left
  //  Grizzly says he's getting sleepy. When time runs out, the child finishes what they're doing
  //  (the next end-of-level or end-of-game screen, or BEDTIME_GRACE seconds at most), then
  //  Grizzly falls asleep until tomorrow.
  const DEFAULT_LIMIT = 20, LAST_MINUTE = 60, BEDTIME_GRACE = 45, LIMIT_CHOICES = [0, 10, 15, 20, 30];

  // ---- Hub mode: inside the all-in-one app (index.html?hub=1 in the app's frame) ----
  //  The app owns the play-time limit, the grown-up settings and the sleep screen. Here the game
  //  doesn't count time or touch its play-time storage: playTime reads the app's {hub:'time'}
  //  messages (no limit until the first one). The gear becomes a "back to all games" house that
  //  posts {hub:'exit'}, and where the gentle bedtime ending would go to sleep it posts
  //  {hub:'sleep'} once. Without ?hub=1 none of this does anything.
  const HUB = /[?&]hub=1\b/.test(location.search) && window.parent !== window;
  const hubTime = { limit: 0, left: Infinity, used: 0, share: 0 };
  let hubSlept = false;
  function hubPost(msg) { if (HUB) try { window.parent.postMessage(msg, '*'); } catch (e) { /* ignore */ } }
  function hubStars() { hubPost({ hub: 'stars', count: Object.values(stars).reduce((a, n) => a + (Number(n) || 0), 0) }); }
  function hubSleep() { if (HUB && !hubSlept) { hubSlept = true; hubPost({ hub: 'sleep' }); } }
  const hubPlayTime = () => ({
    get limit() { return hubTime.limit; },
    setLimit() {}, add() {}, addMinutes() {}, resetToday() {},
    used() { return hubTime.used; },
    allowed() { return hubTime.limit * 60; },
    left() { return hubTime.limit ? hubTime.left : Infinity; },
    share() { return hubTime.limit ? clamp01(hubTime.share) : 0; },
  });
  if (HUB) {
    window.addEventListener('message', e => {
      const m = e.data;
      if (e.source !== window.parent || !m || typeof m !== 'object' || typeof m.hub !== 'string') return;
      if (m.hub === 'time') {
        const limit = Math.max(0, Number(m.limit) || 0), left = Number(m.left);
        hubTime.limit = limit && m.left !== null && Number.isFinite(left) ? limit : 0;
        hubTime.left = hubTime.limit ? left : Infinity;
        hubTime.used = Math.max(0, Number(m.used) || 0);
        hubTime.share = Number(m.share) || 0;
        // more time was given before the app closed the frame: Grizzly wakes up
        if (scene === S.sleep && playTime.left() > 0) { hubSlept = false; go('menu'); }
      } else if (m.hub === 'pause') {
        muted = true;
        if (window.speechSynthesis) try { window.speechSynthesis.cancel(); } catch (err) { /* ignore */ }
      }
    });
    hubPost({ hub: 'hello', game: 'grizzly' });
    hubStars();
  }
  // "Back to all games": a little storybook cottage on a round paper button, where the gear is.
  function drawHubExitButton(x, y) {
    const r = 29, pressed = hot(x - 32, y - 32, 64, 64) && pointer.down ? 3 : 0;
    circle(x, y + 8, r, P.shadow);
    circle(x, y + 5, r, dark(P.cream, 0.34));
    circle(x, y + pressed, r, P.cream);
    ctx.save(); ctx.translate(x, y + pressed + 1);
    solid(rr(6, -19, 6, 12, 1.5), P.woodDark, { depth: 0, rim: 2 });            // chimney
    solid(rr(-13, -5, 26, 21, 3), P.honeyLight, { depth: 3, rim: 2 });          // walls
    const roof = new Path2D();
    roof.moveTo(0, -20); roof.lineTo(20, -2); roof.quadraticCurveTo(20, 1, 17, 1);
    roof.lineTo(-17, 1); roof.quadraticCurveTo(-20, 1, -20, -2); roof.closePath();
    solid(roof, P.coral, { depth: 3, rim: 2 });
    solid(rr(-4.5, 4, 9, 12, 4.5), P.teal, { depth: 0, rim: 2 });              // door
    circle(2, 10.5, 1.2, P.honeyLight);
    ctx.restore();
    buttons.push({ x: x - 32, y: y - 32, w: 64, h: 64, action: () => hubPost({ hub: 'exit' }) });
  }

  const playTime = HUB ? hubPlayTime() : (() => {
    const today = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
    const load = (key, def) => { try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); } catch (e) { return def; } };
    const save = (key, v) => { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) { /* storage blocked: lasts for this visit */ } };
    let limit = load('grizzly-limit', DEFAULT_LIMIT); // minutes a day, 0 = off
    let rec = load('grizzly-play', null);             // { day, used: seconds, extra: minutes }
    const fresh = () => { if (!rec || rec.day !== today()) rec = { day: today(), used: 0, extra: 0 }; return rec; };
    return {
      get limit() { return limit; },
      setLimit(m) { limit = m; save('grizzly-limit', m); },
      used() { return fresh().used; },
      allowed() { return (limit + fresh().extra) * 60; },
      left() { return limit ? this.allowed() - fresh().used : Infinity; },
      add(sec) { fresh().used += sec; save('grizzly-play', rec); },
      addMinutes(m) { fresh().extra += m; save('grizzly-play', rec); },
      resetToday() { rec = { day: today(), used: 0, extra: 0 }; save('grizzly-play', rec); },
      share() { return limit ? clamp01(fresh().used / this.allowed()) : 0; }, // 0 morning .. 1 night
    };
  })();
  const inGame = () => scene !== S.menu && scene !== S.sleep;
  const clockOnTop = () => playTime.limit > 0 && inGame(); // the countdown sits at the top centre in games
  let playAccum = 0, warnedLastMinute = false, graceT = 0, overlayT = 0;

  function updatePlayTime(dt) {
    if (HUB && scene === S.menu && playTime.left() <= 0) { go('sleep'); return; } // no game to finish
    if (!inGame() || modal || document.visibilityState !== 'visible') return;
    if (!HUB) { // in hub mode the app counts the time
      playAccum += dt;
      if (playAccum >= 1) { playTime.add(Math.floor(playAccum)); playAccum %= 1; }
    }
    const left = playTime.left();
    if (left > LAST_MINUTE) { warnedLastMinute = false; return; }
    if (left > 0) {
      if (!warnedLastMinute) { warnedLastMinute = true; say('One more minute, then Grizzly needs to sleep!', true); }
      return;
    }
    // Time is up. Let a finished level or game show for a moment, otherwise allow a short grace.
    graceT += dt;
    overlayT = overlay ? overlayT + dt : 0;
    if (overlayT > 3 || graceT > BEDTIME_GRACE) go('sleep');
  }

  function drawClockIcon(x, y, r, moonBg) {
    if (moonBg) { // a crescent moon once time is nearly up
      circle(x, y, r, P.honey);
      circle(x + r * 0.45, y - r * 0.35, r * 0.8, moonBg);
      return;
    }
    solid(ell(x, y, r, r), '#ffffff', { depth: 0, rim: 2.5, rimColor: INK });
    inkLine(2.2);
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - r * 0.6); ctx.moveTo(x, y); ctx.lineTo(x + r * 0.45, y); ctx.stroke();
  }
  // The countdown chip at the top centre, shown during games.
  function drawPlayClock() {
    if (!clockOnTop()) return;
    const left = Math.max(0, playTime.left()), low = left <= LAST_MINUTE;
    const w = 130, h = 38, cx = W / 2, cy = 29;
    const bg = low ? '#ffe3b3' : P.cream;
    ctx.save(); ctx.translate(cx, cy);
    if (low) { const s = 1 + Math.sin(time * 6) * 0.04; ctx.scale(s, s); }
    panel(-w / 2, -h / 2, w, h, 19, bg, { depth: 4, rim: 2.5, rimColor: low ? '#ff9a2e' : undefined });
    drawClockIcon(-w / 2 + 22, 0, 11, low ? bg : null);
    const label = left > 0 ? `${Math.floor(left / 60)}:${String(Math.floor(left % 60)).padStart(2, '0')}` : 'Last go!';
    text(label, 14, 1, left > 0 ? 23 : 19, low ? '#c0560b' : INK, null);
    ctx.restore();
  }
  // Minutes left today, beside the gear on the menu.
  function drawMenuTime() {
    if (!playTime.limit || playTime.left() <= 0) return;
    const ox = HUB ? 18 : 0; // room for the bigger "back to all games" button
    panel(70 + ox, 12, 118, 36, 18, P.cream, { depth: 4, rim: 2.5 });
    drawClockIcon(91 + ox, 30, 11, null);
    text(`${Math.ceil(playTime.left() / 60)} min`, 140 + ox, 31, 21, INK, null);
  }
  // The grown-up gear (menu and sleep screen, where the home button would be).
  function drawGearButton(x, y) {
    if (HUB) { drawHubExitButton(x + 6, y + 8); if (scene === S.menu) drawMenuTime(); return; }
    roundButton(x, y, openGate, () => {
      ctx.fillStyle = INK;
      for (let i = 0; i < 8; i++) { ctx.save(); ctx.rotate(i * Math.PI / 4); ctx.fill(rr(-3.6, -15, 7.2, 9, 2)); ctx.restore(); }
      circle(0, 0, 10, INK); circle(0, 0, 4, P.cream);
    });
    if (scene === S.menu) drawMenuTime();
  }

  // ---- The grown-up panel: a times-table check, then the play-time settings ----
  let modal = null; // { mode: 'gate' | 'settings', a, b, typed, shake }
  function newSum() { modal.a = randInt(6, 9); modal.b = randInt(6, 9); modal.typed = ''; }
  function openGate() { if (HUB) return; modal = { mode: 'gate', typed: '', shake: 0 }; newSum(); }
  function gateKey(k) {
    if (!modal || modal.mode !== 'gate') return;
    if (k === 'back') modal.typed = modal.typed.slice(0, -1);
    else if (k === 'ok') {
      if (modal.typed && Number(modal.typed) === modal.a * modal.b) { modal.mode = 'settings'; sfx.yay(); }
      else { modal.shake = 0.4; sfx.nope(); newSum(); }
    } else if (modal.typed.length < 2) { modal.typed += k; sfx.click(); }
  }
  function closeModal() {
    modal = null;
    if (scene === S.sleep && playTime.left() > 0) go('menu');      // more time was given: Grizzly wakes up
    else if (scene === S.menu && playTime.left() <= 0) go('sleep');
  }
  const fmtMinutes = sec => sec < 60 ? 'under 1 minute' : `${Math.floor(sec / 60)} min`;
  function drawModal() {
    buttons.length = 0; // only the panel's buttons work while it is open
    ctx.fillStyle = 'rgba(28,20,52,.55)'; ctx.fillRect(0, 0, W, H);
    const px = W / 2 - 280, py = 36, pw = 560, ph = 476;
    panel(px, py, pw, ph - 8, 30, P.cream, { depth: 8, rimColor: P.tan, edge: '#d9b57f' });
    // close button
    const kx = px + pw - 34, ky = py + 34;
    solid(ell(kx, ky, 20, 20), P.paper, { depth: 0, rim: 2.5 });
    inkLine(3.5); ctx.beginPath(); ctx.moveTo(kx - 7, ky - 7); ctx.lineTo(kx + 7, ky + 7); ctx.moveTo(kx + 7, ky - 7); ctx.lineTo(kx - 7, ky + 7); ctx.stroke();
    buttons.push({ x: kx - 26, y: ky - 26, w: 52, h: 52, action: closeModal });

    if (modal.mode === 'gate') {
      text('For grown-ups', W / 2, py + 44, 34, P.woodDark, null);
      const sx = modal.shake > 0 ? Math.sin(time * 60) * 8 : 0;
      text(`What is ${modal.a} × ${modal.b}?`, W / 2 + sx, py + 96, 36, INK, null);
      solid(rr(W / 2 - 70, py + 124, 140, 56, 14), '#ffffff', { depth: 0, rim: 3, rimColor: P.tan });
      text(modal.typed, W / 2, py + 154, 38, INK, null);
      const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'back', '0', 'ok'];
      KEYS.forEach((k, i) => {
        const bx = W / 2 + (i % 3 - 1) * 122, by = py + 222 + Math.floor(i / 3) * 66;
        const label = k === 'back' ? 'Del' : k === 'ok' ? 'OK' : k;
        const color = k === 'ok' ? '#4fb659' : k === 'back' ? '#ef6f6c' : P.wood;
        button(label, bx, by, 108, 52, color, () => gateKey(k));
      });
      return;
    }
    // settings
    text('Play time', W / 2, py + 44, 36, P.woodDark, null);
    text('Each day:', W / 2, py + 96, 26, INK, null);
    LIMIT_CHOICES.forEach((m, i) => {
      const on = playTime.limit === m;
      button(m ? `${m}` : 'Off', W / 2 + (i - 2) * 100, py + 148, 88, 52, on ? '#4fb659' : '#cdb48a', () => playTime.setLimit(m));
    });
    text(`Played today: ${fmtMinutes(playTime.used())}`, W / 2, py + 208, 24, INK, null);
    if (playTime.limit) {
      const left = Math.max(0, playTime.left());
      text(left > 0 ? `Left today: ${fmtMinutes(left)}` : 'No time left today', W / 2, py + 240, 24, left > 0 ? '#2a7a2e' : '#c0392b', null);
      button('+5 minutes today', W / 2, py + 300, 320, 52, '#ff9a2e', () => playTime.addMinutes(5));
    }
    button('Start today again', W / 2, py + 366, 320, 52, '#4f9df7', () => playTime.resetToday());
    button('Done', W / 2, py + 432, 200, 52, '#4fb659', closeModal);
  }

  // ---- Bedtime: Grizzly and the lemmings asleep under the stars ----
  S.sleep = (() => {
    let zT = 0;
    return {
      start() { zT = 0; say('Grizzly is sleepy. Time to rest! See you tomorrow.', true); },
      update(dt) {
        zT -= dt;
        if (zT <= 0) {
          zT = 1.3;
          particles.push({ x: 330 + rand(-8, 8), y: GROUND - 230, vx: rand(12, 30), vy: -38, life: 2.6, max: 2.6,
            color: '#fff6c8', kind: 'text', label: 'z', size: rand(28, 42) });
        }
      },
      render() {
        drawBackground(1);
        drawBear(300, GROUND, 1.1, { pose: 'sleep' });
        [[540, '#e8a35c'], [630, '#f5e6c8'], [720, '#d98b4a']].forEach(([x, c], i) =>
          drawLemmingAt(x, GROUND, 1.6, { color: c, face: 'sleep', seed: i, dir: i % 2 ? -1 : 1, squash: Math.sin(time * 1.6 + i) * 0.04 }));
        panel(W / 2 - 300, 70, 600, 116, 30, P.cream, { depth: 7, rimColor: P.tan, edge: '#d9b57f' });
        text('Time for Grizzly to sleep!', W / 2, 112, 38, INK, null);
        text('See you tomorrow!', W / 2, 156, 29, P.honeyDark, '#fff');
      },
    };
  })();
  // A slow lullaby for bedtime. F C Dm C | Bb F C F
  SONGS.sleep = { bpm: 72, lead: 'sine', vol: 0.11, len: 3.2, bassEvery: 4, bass: [41, 36, 38, 36, 46, 41, 36, 41], melody: [
    77, 0, 0, 0, 72, 0, 0, 0,   76, 0, 0, 0, 72, 0, 0, 0,
    74, 0, 0, 0, 69, 0, 0, 0,   72, 0, 0, 0, 0, 0, 0, 0,
    74, 0, 0, 0, 70, 0, 0, 0,   72, 0, 0, 0, 69, 0, 0, 0,
    67, 0, 0, 0, 72, 0, 0, 0,   69, 0, 0, 0, 0, 0, 0, 0] };

  // =====================================================================
  //  Input
  // =====================================================================
  function toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function hitButton(p) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b;
    }
    return null;
  }

  // Buttons fire when the finger lifts (pointerup), because iOS only lets sound and
  // speech start from that part of a tap. Game taps (booping, catching) still react
  // on pointerdown so they feel instant.
  let pressedButton = false;
  // Swiping left/right on the menu flips pages. It works even when the swipe starts on a card;
  // once the finger has moved sideways it counts as a swipe, and the card is not opened.
  const swipe = { on: false, x: 0, y: 0, moved: false };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    const p = toGame(e); pointer.x = p.x; pointer.y = p.y; pointer.down = true;
    Object.assign(swipe, { on: !modal && scene === S.menu && pageCount() > 1, x: p.x, y: p.y, moved: false });
    pressedButton = !!hitButton(p);
    if (pressedButton) return;
    if (!overlay && !modal && scene.pointer) scene.pointer(p);
  });
  window.addEventListener('pointermove', e => {
    const p = toGame(e); pointer.x = p.x; pointer.y = p.y;
    if (pointer.down && swipe.on) {
      const dx = p.x - swipe.x;
      if (!swipe.moved && Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(p.y - swipe.y)) swipe.moved = true;
      if (swipe.moved) menuDrag = dx;
    }
    if (pointer.down && !pressedButton && !overlay && !modal && scene.drag) scene.drag(p);
  });
  window.addEventListener('pointerup', e => {
    initAudio(true);
    const wasDown = pointer.down;
    pointer.down = false;
    if (wasDown && swipe.on && swipe.moved) {
      // a long enough swipe flips the page; a short one springs back
      swipe.on = false; pressedButton = false;
      if (Math.abs(menuDrag) > 80) flipPage(menuDrag < 0 ? 1 : -1);
      else { menuSlide = menuDrag; menuDrag = 0; }
      return;
    }
    swipe.on = false;
    if (!pressedButton) {
      // scenes that drag things hear about the finger lifting
      if (wasDown && !overlay && !modal && scene.release) scene.release(toGame(e));
      return;
    }
    pressedButton = false;
    const b = hitButton(toGame(e));
    if (b) { sfx.click(); b.action(); }
  });
  window.addEventListener('pointercancel', () => {
    pointer.down = false; pressedButton = false;
    if (swipe.on) { swipe.on = false; menuSlide = menuDrag; menuDrag = 0; }
  });
  // Extra unlock points for iOS, which treats touchend and click as real gestures.
  window.addEventListener('touchend', () => initAudio(true), { passive: true });
  window.addEventListener('click', () => initAudio(true));

  window.addEventListener('keydown', e => {
    initAudio(true);
    const k = e.key;
    if (modal) {
      // the grown-up panel takes the keyboard: digits, Backspace, Enter, Escape
      e.preventDefault();
      if (k === 'Escape') closeModal();
      else if (/^[0-9]$/.test(k)) gateKey(k);
      else if (k === 'Backspace') gateKey('back');
      else if (k === 'Enter') gateKey('ok');
      return;
    }
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; e.preventDefault(); }
    if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; e.preventDefault(); }
    if ((k === 'Enter' || k === ' ') && overlay) { e.preventDefault(); sfx.click(); overlay.buttons[0].action(); }
    if (k === 'Escape' && inGame()) go('menu');
    if (scene === S.menu && (k === 'ArrowLeft' || k === 'ArrowRight')) flipPage(k === 'ArrowLeft' ? -1 : 1);
    if (k === 'm' || k === 'M') muted = !muted;
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; pointer.down = false; });

  // =====================================================================
  //  Main loop
  // =====================================================================
  function update(dt) {
    time += dt;
    for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 120) c.x = -120; }
    updateParticles(dt);
    if (overlay && overlay.win && Math.random() < 0.4) {
      particles.push({ x: rand(0, W), y: -10, vx: rand(-40, 40), vy: rand(50, 150), life: 3, max: 3,
        color: pick(['#ff5c8a', '#ffd93d', '#6bcb77', '#4d96ff', '#c77dff']), kind: 'confetti', size: rand(6, 11) });
    }
    scene.update(dt);
    updatePlayTime(dt);
    if (modal && modal.shake > 0) modal.shake -= dt;
    updateMusic();
  }
  function render() {
    buttons.length = 0;
    ctx.clearRect(0, 0, W, H);
    scene.render();
    if (overlay) drawOverlay();
    drawParticles();
    if (inGame()) drawHome(); else drawGearButton(40, 30);
    drawMute();
    drawPlayClock();
    if (modal) drawModal();
  }

  go(playTime.left() <= 0 ? 'sleep' : 'menu');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Small hook for automated testing.
  window.__game = {
    go,
    get scene() { return Object.keys(S).find(k => S[k] === scene); },
    get overlay() { return overlay && overlay.title; },
    playTime,
    get modal() { return modal && { mode: modal.mode, answer: modal.a * modal.b }; },
    get audio() { return audio ? audio.state : 'none'; },
    get music() { return { on: musicOn, step: musicStep, level: musicLevel, song: playingKey }; },
    songs: SONGS,
    art: { ctx, drawBear, drawLemmingAt, drawTreat, drawBackground, drawSky, drawLand }, // for pose sheets and speed checks in tests
  };
})();
</script>
</body>
</html>
