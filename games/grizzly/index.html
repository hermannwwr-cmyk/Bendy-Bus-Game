  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #17594a;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: "Fredoka", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;

<body>
<div id="wrap"><canvas id="game" width="960" height="540"></canvas></div>
<script>
(() => {
  'use strict';

  // =====================================================================
  //  Setup
  // =====================================================================
  const W = 960, H = 540, GROUND = 470;
  const canvas = document.getElementById('game');
  let ctx = canvas.getContext('2d');
  // make sure the built-in font is loaded before the first words are drawn
  if (document.fonts && document.fonts.load) { document.fonts.load('600 20px Fredoka'); document.fonts.load('700 20px Fredoka'); }

  function resize() {
    const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = Math.floor(W * scale) + 'px';
    canvas.style.height = Math.floor(H * scale) + 'px';
    canvas.width = Math.floor(W * scale * dpr);
    canvas.height = Math.floor(H * scale * dpr);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

  // Saved stickers (stars) per game. Only a convenience; works without storage.
  let stars = {};
  try { stars = JSON.parse(localStorage.getItem('grizzly-stars') || '{}') || {}; } catch (e) { stars = {}; }
  function saveStars() { try { localStorage.setItem('grizzly-stars', JSON.stringify(stars)); } catch (e) { /* ignore */ } hubStars(); }

  // =====================================================================
  //  Sound + voice
  // =====================================================================
  let audio = null, muted = false;
  // A short silent WAV, built here so no file is needed.

      ctx.save(); ctx.translate(kx, -92); ctx.rotate(a * -f);
      const tail = rr(-6.5, 0, 13, len, 4);
      solid(tail, i ? P.teal : dark(P.teal, 0.12), { depth: 0, rim: 2 });
      ctx.fillStyle = P.cream; ctx.fillRect(-6, len - 10, 12, 3.5);
      ctx.restore();
    });
    ctx.lineCap = 'round';
    [[dark(P.teal, 0.34), 19], [P.teal, 14.5]].forEach(([c, w]) => {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(-36, -100); ctx.quadraticCurveTo(0, -84, 36, -100); ctx.stroke();
    });
    solid(ell(kx, -93, 8.5, 7.5), P.teal, { depth: 0, rim: 2 });

    // head: a wide, soft bun shape
    const hx = f * 4, hy = -138;
    [-1, 1].forEach(side => {
      solid(ell(hx + side * 45, hy - 37, 17, 17), P.furDark, { depth: 0 });
      ellipse(hx + side * 45, hy - 36, 9, 9, P.belly);
    });
    const head = new Path2D();
    head.moveTo(hx, hy - 50);
    head.bezierCurveTo(hx + 38, hy - 50, hx + 62, hy - 30, hx + 62, hy + 2);
    head.bezierCurveTo(hx + 62, hy + 34, hx + 36, hy + 48, hx, hy + 48);
    head.bezierCurveTo(hx - 36, hy + 48, hx - 62, hy + 34, hx - 62, hy + 2);
    head.bezierCurveTo(hx - 62, hy - 30, hx - 38, hy - 50, hx, hy - 50);
    solid(head, P.fur, { depth: 10 });
    // tuft of fur on top
    const tuft = new Path2D();
    tuft.moveTo(hx - 13, hy - 46); tuft.quadraticCurveTo(hx - 11, hy - 64, hx - 3, hy - 52);
    tuft.quadraticCurveTo(hx + 1, hy - 69, hx + 7, hy - 52); tuft.quadraticCurveTo(hx + 14, hy - 61, hx + 14, hy - 46);
    tuft.closePath();
    ctx.fillStyle = P.furDark; ctx.fill(tuft);

    // cheeks, muzzle and nose
    const mx = hx + f * 7, my = hy + 17;
    ellipse(hx - 41 + f * 3, hy + 16, 10, 7, 'rgba(255,110,120,.4)');
    ellipse(hx + 41 + f * 3, hy + 16, 10, 7, 'rgba(255,110,120,.4)');
    solid(ell(mx, my, 27, 20), P.belly, { depth: 0, rim: 2 });
    ctx.fillStyle = INK; ctx.fill(rr(mx - 9.5, my - 16, 19, 12.5, 6));
    ellipse(mx - 3.5, my - 12.5, 3.2, 1.8, 'rgba(255,255,255,.6)');

    // eyes
    const eyes = [hx - 26 + f * 5, hx + 26 + f * 5], ey = hy - 5, look = (o.look || 0) * 2.5;
    inkLine(4.2);
    if (asleep) {
      eyes.forEach(ex => { ctx.beginPath(); ctx.arc(ex, ey - 4, 7.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); });
    } else if (happy) {
      eyes.forEach(ex => { ctx.beginPath(); ctx.arc(ex, ey + 4, 8, 1.12 * Math.PI, 1.88 * Math.PI); ctx.stroke(); });
    } else if (blinking(0.5)) {
      eyes.forEach(ex => { ctx.beginPath(); ctx.moveTo(ex - 6.5, ey); ctx.lineTo(ex + 6.5, ey); ctx.stroke(); });
    } else {
      eyes.forEach((ex, i) => {
        const big = puzzled && i === 1 ? 1.22 : 1;
        ellipse(ex + look, ey, 6.2 * big, 7.8 * big, INK);
        circle(ex + look - 2, ey - 2.8, 2.4 * big, '#fff');
        circle(ex + look + 2.2, ey + 2.6, 1.1, 'rgba(255,255,255,.7)');
      });
    }
    // eyebrows: one raised when puzzled
    if (!asleep) {
      ctx.strokeStyle = P.furDark; ctx.lineWidth = 4; ctx.lineCap = 'round';
      eyes.forEach((ex, i) => {
        const tilt = puzzled ? (i === 0 ? 3 : -3) : happy ? -1.5 : 0, up = puzzled && i === 1 ? -6 : 0;
        ctx.beginPath(); ctx.moveTo(ex - 7, ey - 16 + tilt + up); ctx.lineTo(ex + 7, ey - 16 - tilt + up); ctx.stroke();
      });
    }

    // mouth
    const ty = my + 3;
    inkLine(2.8);
    if (asleep) {
      ellipse(mx, ty + 3, 3.6, 4.6, MOUTH);
    } else if (puzzled) {
      ctx.beginPath(); ctx.moveTo(mx - 9, ty + 3); ctx.quadraticCurveTo(mx - 4, ty - 2, mx, ty + 3); ctx.quadraticCurveTo(mx + 4, ty + 8, mx + 9, ty + 3); ctx.stroke();
    } else if (happy) {
      const smile = new Path2D();
      smile.moveTo(mx - 11, ty - 1); smile.quadraticCurveTo(mx, ty + 2, mx + 11, ty - 1);
      smile.quadraticCurveTo(mx + 9, ty + 13, mx, ty + 13); smile.quadraticCurveTo(mx - 9, ty + 13, mx - 11, ty - 1);
      ctx.fillStyle = MOUTH; ctx.fill(smile);
      ctx.save(); ctx.clip(smile); ellipse(mx, ty + 13, 7, 5, '#ff7a8a'); ctx.restore();
    } else {
      ctx.beginPath(); ctx.moveTo(mx, ty - 6); ctx.lineTo(mx, ty - 1); ctx.stroke();
      ctx.beginPath(); ctx.arc(mx, ty - 3, 8, 0.14 * Math.PI, 0.86 * Math.PI); ctx.stroke();
    }

    // bedtime nightcap, drooping to one side with a pom-pom
    if (asleep) {
      const cap = new Path2D();
      cap.moveTo(hx - 50, hy - 28); cap.quadraticCurveTo(hx - 20, hy - 84, hx + 22, hy - 76);
      cap.quadraticCurveTo(hx + 62, hy - 70, hx + 72, hy - 34); cap.quadraticCurveTo(hx + 44, hy - 52, hx + 48, hy - 26);
      cap.quadraticCurveTo(hx, hy - 52, hx - 50, hy - 28); cap.closePath();
      solid(cap, P.teal, { depth: 7 });
      ctx.lineCap = 'round';
      [[dark(P.cream, 0.3), 15], [P.cream, 11]].forEach(([c, w]) => {
        ctx.strokeStyle = c; ctx.lineWidth = w;
        ctx.beginPath(); ctx.moveTo(hx - 48, hy - 27); ctx.quadraticCurveTo(hx, hy - 51, hx + 48, hy - 27); ctx.stroke();
      });
      solid(ell(hx + 73, hy - 30, 10, 10), P.cream, { depth: 3, rim: 2 });
    }
    if (puzzled) arm(1, right);
    ctx.restore();
  }

  // ---------------------------------------------------------------------
  //  A lemming standing on (m.x, m.y): a round fluffball with a dark cap of fur over its
  //  head and back, a cream tummy and bright little eyes. m.color is the coat colour.
  //    m.face: 'happy' | 'dizzy' | 'cheeky' | 'sleep' | undefined (carrying a treat makes it cheeky)
  //    m.squash: > 0 squashes flat, < 0 stretches tall. m.seed keeps blinks and ear wiggles out of sync.
  // ---------------------------------------------------------------------
  function drawLemming(m) {
    ctx.save();
    ctx.translate(m.x, m.y - (m.hop || 0));
    if (m.rot) { ctx.translate(0, -19); ctx.rotate(m.rot); ctx.translate(0, 19); }
    const sq = m.squash || 0;
    ctx.scale((m.dir || 1) * (1 + sq), 1 - sq);
    const coat = m.color || LEMMING_COLORS[0], cap = dark(coat, 0.4), rim = dark(coat, 0.36);
    const seed = m.seed || 0, s = Math.sin(m.step || 0);
    const face = m.mode === 'fly' ? 'dizzy' : m.face || (m.carry ? 'cheeky' : undefined);

    // feet and tail
    [-7 + s * 4, 7 - s * 4].forEach(fx => solid(ell(fx, -2.5, 6.5, 3.8), '#f08a5d', { depth: 0, rim: 1.4 }));
    solid(ell(-19.5, -10, 5, 4.5), cap, { depth: 0, rim: 1.4 });
    // ears, with an occasional wiggle
    const wiggle = Math.sin(time * 1.3 + seed) > 0.6 ? Math.sin(time * 14 + seed * 2) * 0.3 : 0;
    [[-10, -0.45 - wiggle], [8, 0.3 + wiggle]].forEach(([ex, a]) => {
      ctx.save(); ctx.translate(ex, -34); ctx.rotate(a);
      solid(ell(0, -4, 6, 7), cap, { depth: 0, rim: 1.4 });
      ellipse(0, -3.5, 3, 4, '#ffb3c1');
      ctx.restore();
    });
    // body
    const body = ell(0, -20, 21, 19.5);
    ctx.fillStyle = coat; ctx.fill(body);
    ctx.save(); ctx.clip(body);
    ctx.fillStyle = cap;                                        // the cap of darker fur
    ctx.beginPath(); ctx.moveTo(26, -46); ctx.lineTo(18, -37); ctx.quadraticCurveTo(3, -33.5, -8, -27);
    ctx.quadraticCurveTo(-18, -20, -25, -8); ctx.lineTo(-32, -8); ctx.lineTo(-32, -50); ctx.closePath(); ctx.fill();
    ellipse(6.5, -10.5, 13, 10.5, '#fff8ea');                   // tummy
    ctx.restore();
    shadeEdge(body, 4); rimOf(body, rim, 1.8);
    // a tuft between the ears
    ctx.fillStyle = cap;
    ctx.beginPath(); ctx.moveTo(-6, -37.5); ctx.quadraticCurveTo(-5, -46, -1, -40); ctx.quadraticCurveTo(1, -47.5, 4.5, -38.5); ctx.closePath(); ctx.fill();

    if (m.carry) {
      // little arms holding the treat up
      ctx.lineCap = 'round';
      [[-17, -25, -14, -42], [21.5, -21, 18, -42]].forEach(([x1, y1, x2, y2]) => {
        [[rim, 7], [coat, 4.2]].forEach(([c, w]) => {
          ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        });
      });
    }
    // face
    const EYES = [3.5, 14.5], EY = -22.5;
    ellipse(-1.5, -15.5, 3.4, 2.5, 'rgba(255,105,135,.45)'); ellipse(19, -16, 2.4, 2.3, 'rgba(255,105,135,.45)');
    inkLine(2);
    if (face === 'dizzy') {
      inkLine(1.6);
      EYES.forEach(ex => {                                      // swirly eyes
        ctx.beginPath();
        for (let a = 0; a < Math.PI * 4; a += 0.3) ctx.lineTo(ex + Math.cos(a + time * 8) * a * 0.42, EY + Math.sin(a + time * 8) * a * 0.42);
        ctx.stroke();
      });
    } else if (face === 'happy') {
      EYES.forEach(ex => { ctx.beginPath(); ctx.arc(ex, EY + 3, 4.4, Math.PI * 1.12, Math.PI * 1.88); ctx.stroke(); });
    } else if (face === 'sleep') {
      EYES.forEach(ex => { ctx.beginPath(); ctx.arc(ex, EY - 1.5, 4.2, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); });
    } else {
      EYES.forEach((ex, i) => {
        if (blinking(seed) || (face === 'cheeky' && i === 0)) { // closed eye, or a wink when being cheeky
          ctx.beginPath(); ctx.arc(ex, EY + 2.5, 4.2, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
        } else {
          ellipse(ex, EY, 4.1, 5.3, INK);
          circle(ex + 1.2, EY - 1.9, 1.7, '#fff');
          circle(ex - 1.2, EY + 2, 0.8, 'rgba(255,255,255,.7)');
        }
      });
    }
    ellipse(9.5, -16.2, 2.9, 2.2, '#ff7f9a');                   // nose
    ctx.strokeStyle = 'rgba(58,42,60,.35)'; ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(18.5, -14.5); ctx.lineTo(27, -16.5); ctx.moveTo(18.5, -13); ctx.lineTo(27, -11.5); ctx.stroke();
    if (face === 'cheeky') {
      ellipse(9.5, -10.6, 2.7, 3.5, '#ff6b8a');                 // tongue out
    } else if (face === 'sleep') {
      ellipse(9.5, -11.6, 1.6, 2, '#8a2f45');
    } else {
      inkLine(1.3);
      ctx.beginPath(); ctx.arc(7.5, -13.6, 2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(11.5, -13.6, 2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke();
    }
    ctx.restore();
  }
  function drawLemmingAt(x, y, scale, m = {}) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    drawLemming(Object.assign({ x: 0, y: 0, dir: 1, seed: x * 0.013 + y * 0.007 }, m));
    ctx.restore();
  }

  // ---------------------------------------------------------------------
  //  Treats: honey pot, berries, apple, fish. Each fits in about 36 x 36 at scale 1.
  // ---------------------------------------------------------------------
  function drawTreat(type, x, y, rot = 0, s = 1) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
    if (type === 'honey') {
      const pot = ell(0, 3, 16, 14);
      ctx.fillStyle = P.honey; ctx.fill(pot);
      ctx.save(); ctx.clip(pot);
      ctx.fillStyle = P.honeyLight;                             // honey dripping down from the rim
      ctx.beginPath(); ctx.moveTo(-16, -12); ctx.lineTo(16, -12); ctx.lineTo(16, -5);
      ctx.quadraticCurveTo(11, -1, 8, -4); ctx.quadraticCurveTo(6, 6, 2, 3); ctx.quadraticCurveTo(0, -3, -3, -2);
      ctx.quadraticCurveTo(-6, 9, -10, 4); ctx.quadraticCurveTo(-12, -2, -16, -3); ctx.closePath(); ctx.fill();
      ctx.restore();
      shadeEdge(pot, 4); rimOf(pot, dark(P.honey, 0.36), 1.8);
      solid(rr(-13, -17, 26, 9, 4.5), dark(P.honey, 0.18), { depth: 0, rim: 1.8 });
      solid(ell(0, -17, 9.5, 3.4), P.paper, { depth: 0, rim: 1.6 });
      ellipse(-8, 0, 2.6, 4.4, 'rgba(255,255,255,.55)', 0.3);
    } else if (type === 'berries') {
      [[-7, 5, '#4f63d8'], [7, 5, '#4a5ccf'], [0, -5, P.berry]].forEach(([bx, by, c]) => {
        solid(ell(bx, by, 8.4, 8.4), c, { depth: 2.6, rim: 1.6 });
        circle(bx - 2.6, by - 3, 2, 'rgba(255,255,255,.55)');
      });
      [[5, -15, -0.6], [-4, -15.5, 0.5]].forEach(([lx, ly, a]) => solid(ell(lx, ly, 7, 3.4, a), P.leaf, { depth: 0, rim: 1.4 }));
    } else if (type === 'apple') {
      ctx.strokeStyle = P.woodDark; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, -9); ctx.quadraticCurveTo(0, -15, 3, -18); ctx.stroke();
      const apple = new Path2D();
      apple.moveTo(0, -9); apple.bezierCurveTo(7, -15, 17, -9, 16, 3); apple.bezierCurveTo(15, 14, 6, 18, 0, 15);
      apple.bezierCurveTo(-6, 18, -15, 14, -16, 3); apple.bezierCurveTo(-17, -9, -7, -15, 0, -9);
      solid(apple, '#f0483e', { depth: 4, rim: 1.8 });
      ellipse(-8, -1, 2.6, 5, 'rgba(255,255,255,.55)', 0.35);
      solid(ell(9, -15, 7, 3.4, -0.5), P.leaf, { depth: 0, rim: 1.4 });
    } else if (type === 'fish') {
      const FISH = '#35b6d6';
      const tail = new Path2D(); tail.moveTo(-11, 0); tail.lineTo(-25, -10); tail.quadraticCurveTo(-20, 0, -25, 10); tail.closePath();
      solid(tail, dark(FISH, 0.12), { depth: 0, rim: 1.8 });
      const body = new Path2D();
      body.moveTo(-14, 0); body.quadraticCurveTo(0, -15, 19, 0); body.quadraticCurveTo(0, 15, -14, 0);
      ctx.fillStyle = FISH; ctx.fill(body);
      ctx.save(); ctx.clip(body); ellipse(2, 9, 18, 6, '#c9f1f9'); ctx.restore();
      shadeEdge(body, 3); rimOf(body, dark(FISH, 0.36), 1.8);
      circle(10, -2.5, 3, '#fff'); circle(10.8, -2.5, 1.7, INK);
      ctx.strokeStyle = dark(FISH, 0.3); ctx.lineWidth = 1.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(-1, 0, 6.5, -0.9, 0.9); ctx.stroke();
    }
    ctx.restore();
  }

  // A burrow with something peeking out. up: 0 (hidden) .. 1 (all the way up)
  function drawHole(hx, hy, up, critter) {
    const DIRT = '#a9714a';
    solid(ell(hx, hy, 80, 27), DIRT, { depth: 0, rim: 2.5 });
    ellipse(hx, hy + 2, 64, 18, '#4a2f3a');
    ellipse(hx, hy + 7, 56, 12, '#35202c');
    if (critter && up > 0) {
      ctx.save();
      ctx.beginPath(); ctx.rect(hx - 110, hy - 240, 220, 240); ctx.clip();
      critter(hx, hy + 10 + (1 - up) * 125);
      ctx.restore();
    }
    // the front lip of the mound, with tufts of grass at each side
    ctx.lineCap = 'round';
    [[dark(DIRT, 0.34), 15], [light(DIRT, 0.12), 10]].forEach(([c, w]) => {
      ctx.strokeStyle = c; ctx.lineWidth = w;
      ctx.beginPath(); ctx.ellipse(hx, hy, 74, 23, 0, 0.04 * Math.PI, 0.96 * Math.PI); ctx.stroke();
    });
    [-1, 1].forEach(side => {
      ctx.fillStyle = '#58ad52';
      ctx.beginPath();
      const gx = hx + side * 78, gy = hy + 8;
      ctx.moveTo(gx - 10, gy); ctx.lineTo(gx - 6, gy - 14); ctx.lineTo(gx - 1, gy - 2); ctx.lineTo(gx + 3, gy - 17); ctx.lineTo(gx + 10, gy); ctx.closePath(); ctx.fill();
    });
  }

  // =====================================================================
  //  Particles (stars, hearts, confetti, floating words)
  // =====================================================================
  let particles = [];
  function burst(x, y, color, n = 10, kind = 'star') {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(80, 240);
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 100, life: rand(0.6, 1.1), max: 1.1, color, kind, size: rand(6, 12) });
    }
  }
  function floatText(str, x, y, color = '#fff', size = 30) {
    particles.push({ x, y, vx: 0, vy: -70, life: 1.2, max: 1.2, color, kind: 'text', label: str, size });
  }
  // Little dust clouds for landings, skids and bumps.
  function puff(x, y, n = 6, spread = 70) {
    for (let i = 0; i < n; i++) {
      particles.push({ x: x + rand(-10, 10), y: y - rand(0, 8), vx: rand(-spread, spread), vy: rand(-45, -10),
        life: rand(0.45, 0.75), max: 0.75, color: '#fff3d6', kind: 'dust', size: rand(7, 13) });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      if (p.kind === 'dust') { p.vx *= 0.92; p.vy *= 0.92; }
      else if (p.kind !== 'text') p.vy += 400 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticles() {
    for (const p of particles) {
      ctx.globalAlpha = clamp01(p.life / p.max * 1.5);
      if (p.kind === 'heart') drawHeart(p.x, p.y, p.size, P.rose);
      else if (p.kind === 'confetti') {
        // paper shapes: strips, dots and triangles
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.life * 6 + p.size);
        ctx.fillStyle = p.color;
        const kind = Math.round(p.size * 10) % 3;
        if (kind === 0) ctx.fill(rr(-p.size / 2, -p.size / 4, p.size, p.size / 2, 2));
        else if (kind === 1) { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.36, 0, Math.PI * 2); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(0, -p.size * 0.5); ctx.lineTo(p.size * 0.45, p.size * 0.35); ctx.lineTo(-p.size * 0.45, p.size * 0.35); ctx.closePath(); ctx.fill(); }
        ctx.restore();
      } else if (p.kind === 'text') text(p.label, p.x, p.y, p.size, p.color, INK);
      else if (p.kind === 'dust') circle(p.x, p.y, p.size * (1.7 - p.life / p.max * 0.7), p.color);
      else drawStar(p.x, p.y, p.size, p.color);
    }
    ctx.globalAlpha = 1;
  }

  // =====================================================================
  //  Buttons, HUD, overlay
  // =====================================================================
  const pointer = { x: -1, y: -1, down: false };
  const buttons = [];
  function hot(x, y, w, h) { return pointer.x > x && pointer.x < x + w && pointer.y > y && pointer.y < y + h; }
  // Small pictures that can sit beside a button's label.
  const GLYPHS = {
    again(s) {                                                  // a looping arrow
      const r = s * 0.4, a1 = 1.2 * Math.PI, h = s * 0.3;
      ctx.lineWidth = s * 0.19; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.arc(0, 0, r, -0.1 * Math.PI, a1); ctx.stroke();
      const ex = Math.cos(a1) * r, ey = Math.sin(a1) * r, tx = -Math.sin(a1), ty = Math.cos(a1);
      ctx.beginPath(); ctx.moveTo(ex + tx * h, ey + ty * h); ctx.lineTo(ex - ty * h * 0.8, ey + tx * h * 0.8); ctx.lineTo(ex + ty * h * 0.8, ey - tx * h * 0.8);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    },
    next(s) {
      ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.2;
      ctx.beginPath(); ctx.moveTo(-s * 0.3, -s * 0.42); ctx.lineTo(s * 0.42, 0); ctx.lineTo(-s * 0.3, s * 0.42); ctx.closePath(); ctx.fill(); ctx.stroke();
    },
    home(s) {
      ctx.lineJoin = 'round'; ctx.lineWidth = s * 0.16;
      ctx.beginPath(); ctx.moveTo(0, -s * 0.5); ctx.lineTo(s * 0.52, -s * 0.02); ctx.lineTo(-s * 0.52, -s * 0.02); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fill(rr(-s * 0.34, -s * 0.06, s * 0.68, s * 0.5, s * 0.08));
    },
  };
  // A chunky push button: a coloured face on a darker base. icon is a GLYPHS name, drawn after the label.
  function button(label, x, y, w, h, color, action, icon) {
    const hover = hot(x - w / 2, y - h / 2, w, h), pressed = hover && pointer.down;
    const s = (1 + Math.sin(time * 4) * 0.02) * (hover ? 1.04 : 1);
    const d = Math.max(5, Math.round(h * 0.11)), r = Math.min(h * 0.45, 30), push = pressed ? d * 0.6 : 0;
    const base = dark(color, 0.3);
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = P.shadow; ctx.fill(rr(-w / 2, -h / 2 + d + 4, w, h, r));
    ctx.fillStyle = base; ctx.fill(rr(-w / 2, -h / 2 + d, w, h, r));
    const face = rr(-w / 2, -h / 2 + push, w, h, r);
    ctx.fillStyle = color; ctx.fill(face);

  // ---------------------------------------------------------------------
  //  Game 1: Catch — move Grizzly to catch falling treats
  // ---------------------------------------------------------------------
  S.catch = (() => {
    const LEVELS = [
      { goal: 10, fall: 110, treatEvery: 1.6, lemmingEvery: 5.5, lemSpeed: [50, 70] },
      { goal: 15, fall: 150, treatEvery: 1.3, lemmingEvery: 3.8, lemSpeed: [60, 90] },
      { goal: 20, fall: 190, treatEvery: 1.05, lemmingEvery: 2.8, lemSpeed: [70, 110] },
    ];
    const TREATS = ['honey', 'berries', 'apple', 'honey', 'fish'];
    // happy: seconds of celebrating a catch (arms up first, then a tummy rub). squash: catch bounce.
    const bear = { x: W / 2, target: null, facing: 1, walk: 0, happy: 0, squash: 0, lastMove: 0, moving: false };
    let level = 0, caught = 0, bonks = 0, treats = [], lemmings = [], treatTimer = 0, lemTimer = 0, levelTime = 0;

    function startLevel(n) {
      level = n; caught = 0; treats = []; lemmings = [];
      treatTimer = 0.5; lemTimer = 3; levelTime = 0;
      bear.x = W / 2; bear.target = null;
    }
    function scoreOne(t) {
      t.dead = true; caught++; bear.happy = 1.1; bear.squash = 0.14;
      sfx.catch(); burst(t.x, t.y, '#ffd93d', 12);
      if (caught >= LEVELS[level].goal) {
        if (level === LEVELS.length - 1) {
          celebrate('catch', 'You did it!', bonks ? `Full tummy! ${bonks} lemmings bumped` : 'Grizzly has a full tummy!');
        } else {
          sfx.fanfare(); say('Yummy!');
          burst(bear.x, GROUND - 150, '#ff5c8a', 30, 'heart');
          overlay = {
            title: 'Yummy!', sub: `Level ${level + 1} done!`,
            buttons: [{ label: 'NEXT', icon: 'next', color: '#4fb659', action: () => { overlay = null; startLevel(level + 1); } }],
          };
        }
      }
    }

    return {
      start() { bonks = 0; startLevel(0); },
      update(dt) {
        if (overlay) { bear.walk += dt * 6; return; }
        const L = LEVELS[level];
        levelTime += dt;

        let move = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        if (move !== 0) bear.target = null;
        if (bear.target !== null && Math.abs(bear.target - bear.x) > 6) move = Math.sign(bear.target - bear.x);
        bear.moving = move !== 0;
        // a little dust cloud when Grizzly sets off or skids round
        if (move && move !== bear.lastMove) puff(bear.x - move * 30, GROUND, 5);
        bear.lastMove = move;
        if (move) {
          bear.x += move * 360 * dt;
          if (bear.target !== null && Math.sign(bear.target - bear.x) !== move) bear.x = bear.target;
          bear.facing = move; bear.walk += dt * 12;
        }
        bear.x = Math.max(60, Math.min(W - 60, bear.x));
        bear.happy = Math.max(0, bear.happy - dt);
        bear.squash = Math.max(0, bear.squash - dt * 0.7);

        treatTimer -= dt;
        if (treatTimer <= 0) {
          treats.push({ x: rand(80, W - 80), y: 120, vy: 0, type: pick(TREATS), rot: rand(-0.3, 0.3), spin: rand(-1.5, 1.5), grounded: false, life: 5, held: false });
          treatTimer = L.treatEvery * rand(0.8, 1.2);
        }
        lemTimer -= dt;
        if (lemTimer <= 0) {
          const fromLeft = Math.random() < 0.5;
          lemmings.push({ x: fromLeft ? -30 : W + 30, y: GROUND, dir: fromLeft ? 1 : -1, speed: rand(L.lemSpeed[0], L.lemSpeed[1]),
            color: pick(LEMMING_COLORS), mode: 'walk', carry: null, vx: 0, vy: 0, rot: 0, step: rand(0, 6), hop: 0, seed: rand(0, 10) });
          lemTimer = L.lemmingEvery * rand(0.8, 1.2);
        }

        for (const t of treats) {
          if (t.held || overlay) continue;
          if (!t.grounded) {
            t.vy = Math.min(L.fall, t.vy + 300 * dt);
            t.y += t.vy * dt; t.rot += t.spin * dt;
            if (t.y > GROUND - 190 && t.y < GROUND - 80 && Math.abs(t.x - bear.x) < 70) { scoreOne(t); continue; }
            if (t.y >= GROUND - 14) { t.y = GROUND - 14; t.grounded = true; t.rot = 0; sfx.plop(); puff(t.x, GROUND, 3, 40); }
          } else {
            t.life -= dt;
            if (Math.abs(t.x - bear.x) < 45) { scoreOne(t); continue; }
            if (t.life <= 0) t.dead = true;
          }
        }

        for (const m of lemmings) {
          m.step += dt * 14;
          if (m.mode === 'walk' || m.mode === 'run') {
            m.x += m.dir * (m.mode === 'run' ? m.speed * 1.8 : m.speed) * dt;
            m.hop = Math.abs(Math.sin(m.step)) * 5;
            if (m.mode === 'walk') {
              for (const t of treats) {
                if (t.grounded && !t.held && !t.dead && Math.abs(t.x - m.x) < 18) {
                  t.held = true; m.carry = t; m.mode = 'run';
                  m.dir = m.x < W / 2 ? -1 : 1;
                  sfx.giggle();
                  break;
                }
              }
            }
            if (Math.abs(m.x - bear.x) < 55) {
              m.mode = 'fly';
              m.vx = (m.x < bear.x ? -1 : 1) * rand(150, 250);
              m.vy = -rand(420, 520);
              bonks++; sfx.boing();
              burst(m.x, m.y - 20, '#fff', 8, 'heart');
              puff(m.x, GROUND, 8);
              if (m.carry) {
                const t = m.carry; t.held = false; t.grounded = false; t.y = m.y - 60; t.x = m.x; t.vy = -200; t.life = 5;
                m.carry = null;
              }
            }
            if (m.x < -60 || m.x > W + 60) { m.dead = true; if (m.carry) m.carry.dead = true; }
          } else {
            m.vy += 700 * dt; m.x += m.vx * dt; m.y += m.vy * dt; m.rot += dt * 10;
            if (m.y > H + 60 || m.x < -80 || m.x > W + 80) m.dead = true;
          }
          if (m.carry) { m.carry.x = m.x; m.carry.y = m.y - 46 - m.hop; }
        }
        treats = treats.filter(t => !t.dead);
        lemmings = lemmings.filter(m => !m.dead);
      },
      render() {
        drawBackground();
        for (const t of treats) {
          if (t.held) continue;
          if (t.grounded && t.life < 1.5 && Math.floor(time * 8) % 2) continue;
          drawTreat(t.type, t.x, t.y, t.rot);
        }
        const pose = overlay ? undefined : bear.happy > 0.75 ? 'up' : bear.happy > 0 ? 'rub' : undefined;
        drawBear(bear.x, GROUND, 1, { facing: bear.facing, walk: bear.walk, moving: bear.moving, pose, squash: bear.squash, dance: !!overlay });
        for (const m of lemmings) {
          drawLemming(m);
          if (m.carry) drawTreat(m.carry.type, m.carry.x, m.carry.y, 0, 0.9);
        }
        drawProgress((x, y) => drawTreat('honey', x, y), caught, LEVELS[level].goal);
        for (let i = 0; i < LEVELS.length; i++) drawStar(clockOnTop() ? W / 2 + 92 + i * 36 : W / 2 + 60 + i * 40, clockOnTop() ? 30 : 38, 16, i <= level ? P.honey : 'rgba(255,246,224,.6)');
        if (!overlay && levelTime < 2) {
          ctx.globalAlpha = Math.min(1, 2 - levelTime);
          text(`Level ${level + 1}`, W / 2, H / 2 - 60, 72, '#ffd93d', '#3a2a3c');
          ctx.globalAlpha = 1;
        }
      },
      pointer(p) { bear.target = p.x; },
      drag(p) { bear.target = p.x; },
    };
  })();

  // ---------------------------------------------------------------------
  //  Game 2: Boop! — tap lemmings that pop out of holes (not Grizzly!)
  // ---------------------------------------------------------------------
  S.boop = (() => {
    const GOAL = 15;
    const holes = [];
    for (const y of [315, 455]) for (const x of [200, 480, 760]) holes.push({ x, y });
    let count = 0, spawnT = 0, doneT = 0;

    return {
      start() {
        count = 0; spawnT = 1; doneT = 0;
        for (const h of holes) Object.assign(h, { who: null, up: 0, phase: 'up', stay: 0, booped: false, color: '#f2c27b', dir: 1 });
      },
      update(dt) {
        if (overlay) return;
        if (doneT > 0) {
          doneT -= dt;
          if (doneT <= 0) celebrate('boop', 'Boop-tastic!', 'You tickled all the lemmings!');
        } else {
          spawnT -= dt;
          const maxUp = count < 5 ? 1 : count < 10 ? 2 : 3;
          const active = holes.filter(h => h.who).length;
          if (spawnT <= 0 && active < maxUp) {
            const empty = holes.filter(h => !h.who);
            const h = pick(empty);
            h.who = count > 2 && Math.random() < 0.18 ? 'bear' : 'lem';
            h.phase = 'up'; h.up = 0; h.booped = false;
            h.stay = Math.max(1.1, 2.3 - count * 0.06);
            h.color = pick(LEMMING_COLORS); h.dir = pick([1, -1]); h.seed = rand(0, 10);
            spawnT = rand(0.4, 0.9);
            sfx.pop();
            puff(h.x, h.y - 4, 5, 60);
          }
        }
        for (const h of holes) {
          if (!h.who) continue;
          if (h.phase === 'up') { h.up += dt * 5; if (h.up >= 1) { h.up = 1; h.phase = 'stay'; } }
          else if (h.phase === 'stay') { h.stay -= dt; if (h.stay <= 0) h.phase = 'down'; }
          else { h.up -= dt * 4; if (h.up <= 0) { h.up = 0; h.who = null; } }
        }
      },
      render() {
        drawBackground();
        // a rolling meadow full of burrows: two bands of grass with scalloped edges
        [[246, '#9bdf7c', '#84d06c'], [386, '#8bd870', P.grass]].forEach(([top, edge, fill], k) => {
          const wave = x => top + 12 + Math.sin(x / 90 + k * 2) * 10;
          ctx.fillStyle = edge;
          for (let x = -8; x < W + 24; x += 26) { ctx.beginPath(); ctx.arc(x, wave(x), 17, 0, Math.PI * 2); ctx.fill(); }
          ctx.fillStyle = fill;
          ctx.beginPath(); ctx.moveTo(0, H);
          for (let x = 0; x <= W; x += 24) ctx.lineTo(x, wave(x) + 2);
          ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
        });
        drawFlowers(262, 96);
        for (const h of holes) {
          // stretch tall while springing up, squash flat for a moment when booped
          const squash = h.phase === 'up' ? -0.15 * (1 - h.up) : h.booped && h.phase === 'stay' && h.stay > 0.3 ? 0.16 : 0;
          drawHole(h.x, h.y, h.up, h.who === 'lem'
            ? (x, y) => drawLemmingAt(x, y, 2.2, { color: h.color, dir: h.dir, seed: h.seed, squash, face: h.booped ? 'happy' : undefined })
            : h.who === 'bear'
              // Grizzly waves; if he gets booped he scratches his head, puzzled
              ? (x, y) => drawBear(x, y, 0.62, { pose: h.booped ? 'scratch' : 'up', squash })
              : null);
        }
        drawProgress((x, y) => drawLemmingAt(x, y + 14, 0.9, { color: '#e8a35c', face: 'happy' }), count, GOAL);
      },
      pointer(p) {
        if (doneT > 0) return;
        for (const h of holes) {
          if (!h.who || h.booped || h.up < 0.4) continue;
          if (Math.hypot(p.x - h.x, p.y - (h.y - 50 * h.up)) < 72) {
            h.booped = true; h.phase = 'stay'; h.stay = 0.5;
            if (h.who === 'lem') {
              count++;
              sfx.giggle();
              burst(h.x, h.y - 70, '#ff5c8a', 8, 'heart');
              floatText('+1', h.x + 40, h.y - 100, '#ffd93d');
              if (count >= GOAL) doneT = 0.8;
            } else {
              sfx.oops();
              floatText("That's Grizzly!", h.x, h.y - 140, '#fff', 28);
            }
            return;
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Game 3: Match — memory pairs
  // ---------------------------------------------------------------------
  S.match = (() => {
    const FACES = ['bear', 'lemming', 'honey', 'berries', 'apple', 'fish'];
    const CW = 150, CH = 130, GAP = 18, X0 = (W - (4 * CW + 3 * GAP)) / 2, Y0 = 84;
    let cards = [], open = [], lockT = 0, pairs = 0, doneT = 0;

    function drawFace(f, x, y) {
      if (f === 'bear') drawBear(x, y + 44, 0.45, { happy: true });
      else if (f === 'lemming') drawLemmingAt(x, y + 38, 2, { color: '#e8a35c' });
      else drawTreat(f, x, y + 4, 0, 2.2);
    }
    return {
      start() {
        const deck = shuffle([...FACES, ...FACES]);
        cards = deck.map((f, i) => ({
          f, x: X0 + (i % 4) * (CW + GAP) + CW / 2, y: Y0 + Math.floor(i / 4) * (CH + GAP) + CH / 2,
          flip: 0, target: 0, matched: false, shake: 0,
        }));
        open = []; lockT = 0; pairs = 0; doneT = 0;
      },
      update(dt) {
        for (const c of cards) {
          c.flip += Math.sign(c.target - c.flip) * Math.min(Math.abs(c.target - c.flip), dt * 5);
          c.shake = Math.max(0, c.shake - dt);
        }
        if (overlay) return;
        if (lockT > 0) { lockT -= dt; if (lockT <= 0) { open.forEach(c => { c.target = 0; }); open = []; sfx.flip(); } }
        if (doneT > 0) { doneT -= dt; if (doneT <= 0) celebrate('match', 'Super memory!', 'You found all the pairs!'); }
      },
      render() {
        drawBackground();
        for (const c of cards) {
          const sx = Math.max(0.03, Math.abs(Math.cos(c.flip * Math.PI)));
          const front = c.flip > 0.5;
          ctx.save();
          ctx.translate(c.x + (c.shake ? Math.sin(c.shake * 40) * 5 : 0), c.y + (c.matched ? Math.sin(time * 3 + c.x) * 3 : 0));
          ctx.scale(sx, 1);
          const BACK = P.teal, edge = front ? dark(P.cream, 0.3) : dark(BACK, 0.3);
          ctx.fillStyle = P.shadow; ctx.fill(rr(-CW / 2, -CH / 2 + 10, CW, CH, 18));
          ctx.fillStyle = edge; ctx.fill(rr(-CW / 2, -CH / 2 + 6, CW, CH, 18));
          const face = rr(-CW / 2, -CH / 2, CW, CH, 18);
          if (front) {
            ctx.fillStyle = c.matched ? '#fff0b8' : P.cream; ctx.fill(face);
            rimOf(face, c.matched ? P.honey : P.tan, c.matched ? 5 : 3);
            drawFace(c.f, 0, 0);
          } else {
            ctx.fillStyle = BACK; ctx.fill(face);
            rimOf(rr(-CW / 2 + 9, -CH / 2 + 9, CW - 18, CH - 18, 11), 'rgba(255,255,255,.3)', 3);
            // paw print
            const PAW = light(BACK, 0.4);
            ellipse(0, 12, 21, 17, PAW);
            [[-23, -11], [-9, -25], [9, -25], [23, -11]].forEach(([px, py]) => circle(px, py, 8.5, PAW));
            rimOf(face, edge, 3);
          }
          ctx.restore();
        }
        drawProgress((x, y) => drawStar(x, y, 16, '#ffd93d'), pairs, FACES.length);
      },
      pointer(p) {
        if (lockT > 0 || doneT > 0) return;
        const c = cards.find(k => Math.abs(p.x - k.x) < CW / 2 && Math.abs(p.y - k.y) < CH / 2);
        if (!c || c.matched || c.target === 1) return;
        c.target = 1; sfx.flip(); open.push(c);
        if (open.length === 2) {
          const [a, b] = open;
          if (a.f === b.f) {
            a.matched = b.matched = true; open = []; pairs++;
            setTimeout(() => { sfx.catch(); burst(a.x, a.y, '#ffd93d', 10); burst(b.x, b.y, '#ffd93d', 10); }, 200);
            if (pairs === FACES.length) doneT = 1.2;
          } else {
            lockT = 1.1;
            setTimeout(() => { a.shake = b.shake = 0.3; sfx.nope(); }, 250);
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Shared pieces for the number games (Count, Add, Take Away)
  // ---------------------------------------------------------------------
  // Three answer choices: the right one plus two nearby numbers in [min, max].
  function pickChoices(answer, min, max) {
    const set = new Set([answer]);
    while (set.size < 3) { const n = answer + pick([-2, -1, 1, 2]); if (n >= min && n <= max) set.add(n); }
    return shuffle([...set]);
  }
  // Big round number buttons. q = { choices, xs, y, r, wrong, answer, solved, color }
  function drawChoices(q) {
    q.choices.forEach((n, i) => {
      const x = q.xs[i], isWrong = q.wrong.has(n), isRight = q.solved && n === q.answer;
      const over = hot(x - q.r, q.y - q.r, q.r * 2, q.r * 2) && !isWrong && !q.solved;
      const s = isRight ? 1.15 + Math.sin(time * 8) * 0.05 : over ? 1.07 : 1;
      const color = isRight ? '#4fb659' : q.color, d = Math.max(5, q.r * 0.13), push = over && pointer.down ? d * 0.6 : 0;
      ctx.save(); ctx.translate(x, q.y); ctx.scale(s, s);
      ctx.globalAlpha = isWrong || (q.solved && !isRight) ? 0.35 : 1;
      circle(0, d + 4, q.r, P.shadow);
      circle(0, d, q.r, dark(color, 0.3));
      const face = ell(0, push, q.r, q.r);
      ctx.fillStyle = color; ctx.fill(face);
      ctx.save(); ctx.clip(face); ellipse(0, push - q.r * 0.6, q.r * 0.82, q.r * 0.42, 'rgba(255,255,255,.2)'); ctx.restore();
      rimOf(face, dark(color, 0.3), 2.5);
      text(String(n), 0, push + 2, q.r * 1.1, '#fff', dark(color, 0.45));
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  }
  // Index of the choice button under p, or -1.
  function hitChoice(p, xs, y, r) {
    return xs.findIndex(x => Math.hypot(p.x - x, p.y - y) < r + 8);
  }
  // A paper tag with a number, shown over things the child has tapped to count.
  function drawCountBadge(x, y, n, color) {
    circle(x, y + 3, 18, P.shadow);
    solid(ell(x, y, 18, 18), P.cream, { depth: 0, rim: 3, rimColor: color });
    text(String(n), x, y + 1, 24, color, null);
  }
  // Hop physics for tappable lemmings and pots: jy = height offset, jv = speed, land = squash timer.
  function updateHop(it, dt) {
    it.land = Math.max(0, (it.land || 0) - dt);
    if (it.jy < 0 || it.jv < 0) {
      it.jv += 1300 * dt; it.jy += it.jv * dt;
      if (it.jy > 0) { it.jy = 0; it.jv = 0; it.land = 0.15; }
    }
  }
  // Stretch tall in the air, squash flat for a moment after landing.
  function hopSquash(it) { return it.jy < 0 ? -0.1 : it.land > 0 ? it.land : 0; }
  // Centred at the top, or just right of the play-time clock when that is showing there.
  function drawRoundStars(done, total) {
    for (let i = 0; i < total; i++) {
      const x = clockOnTop() ? W / 2 + 92 + i * 36 : W / 2 - (total - 1) * 20 + i * 40;
      drawStar(x, clockOnTop() ? 30 : 38, clockOnTop() ? 15 : 16, i < done ? P.honey : 'rgba(255,246,224,.6)');
    }
  }

  // ---------------------------------------------------------------------
  //  Game 4: Count — how many lemmings came to visit?
  // ---------------------------------------------------------------------
  S.count = (() => {
    const RANGES = [[2, 3], [3, 4], [4, 6], [5, 7], [6, 9]];
    const CHOICE_X = [430, 590, 750], CHOICE_Y = 195, CHOICE_R = 55;
    let round = 0, target = 0, lems = [], phase = 'walk', choices = [], wrong = new Set(), tapN = 0, timer = 0, puzzledT = 0;

    function newRound() {
      puzzledT = 0;
      const [a, b] = RANGES[round];
      target = randInt(a, b);
      const span = Math.min(80 * (target - 1), 620);
      const startX = 560 - span / 2;
      lems = [];
      for (let i = 0; i < target; i++) {
        lems.push({ x: -60 - i * 80, tx: target === 1 ? 560 : startX + i * span / (target - 1), color: pick(LEMMING_COLORS),
          step: rand(0, 6), hop: 0, jy: 0, jv: 0, num: 0, seed: rand(0, 10) });
      }
      choices = pickChoices(target, 1, 10);
      wrong = new Set(); tapN = 0; phase = 'walk';
    }
    function jump(l) { if (l.jy === 0) l.jv = -320; }

    return {
      start() { round = 0; newRound(); },
      update(dt) {
        for (const l of lems) {
          l.step += dt * 14;
          if (l.x < l.tx) {
            l.x = Math.min(l.tx, l.x + 330 * dt); l.hop = Math.abs(Math.sin(l.step)) * 5;
            if (l.x === l.tx) puff(l.x - 15, GROUND, 3, 40); // skid to a stop
          } else l.hop = 0;
          updateHop(l, dt);
        }
        puzzledT = Math.max(0, puzzledT - dt);
        if (overlay) return;
        if (phase === 'walk' && lems.every(l => l.x >= l.tx)) { phase = 'ask'; say('How many lemmings?'); }
        if (phase === 'right') {
          if (Math.random() < 0.15) jump(pick(lems));
          timer -= dt;
          if (timer <= 0) {
            round++;
            if (round >= RANGES.length) { phase = 'done'; celebrate('count', 'Super counting!', 'You counted every lemming!'); }
            else newRound();
          }
        }
      },
      render() {
        drawBackground();
        const cheering = phase === 'right' || phase === 'done';
        drawBear(95, GROUND, 0.85, { happy: cheering, dance: cheering, pose: puzzledT > 0 ? 'scratch' : undefined });

        if (phase !== 'walk') {
          // speech bubble
          const msg = cheering ? `Yes! ${target}!` : puzzledT > 0 ? 'Hmm...' : 'How many?';
          speechBubble(150, 205, 190, 62, [136, 294]);
          text(msg, 245, 236, 28, '#7c4fd0', null);

          drawChoices({ choices, xs: CHOICE_X, y: CHOICE_Y, r: CHOICE_R, wrong, answer: target, solved: cheering, color: '#9b5de5' });
        }

        for (const l of lems) {
          drawLemmingAt(l.x, GROUND - l.hop + l.jy, 1.6, { color: l.color, step: l.step, seed: l.seed, squash: hopSquash(l), face: cheering ? 'happy' : undefined });
          if (l.num) drawCountBadge(l.x, GROUND - 92 + l.jy, l.num, '#9b5de5');
        }
        drawRoundStars(round, RANGES.length);
      },
      pointer(p) {
        if (phase === 'ask') {
          const i = hitChoice(p, CHOICE_X, CHOICE_Y, CHOICE_R);
          if (i >= 0) {
            const n = choices[i];
            if (wrong.has(n)) return;
            if (n === target) {
              phase = 'right'; timer = 2.2;
              sfx.yay(); say(`Yes! ${target} lemmings!`);
              lems.forEach(jump);
              burst(CHOICE_X[i], CHOICE_Y, '#ffd93d', 16);
            } else {
              wrong.add(n); sfx.nope(); say('Try again!'); puzzledT = 1.4;
            }
            return;
          }
        }
        if (phase === 'done') return;
        for (const l of lems) {
          if (Math.abs(p.x - l.x) < 40 && p.y > GROUND - 110 && p.y < GROUND + 15) {
            if (!l.num) { tapN++; l.num = tapN; sfx.count(tapN); say(String(tapN)); }
            jump(l);
            return;
          }
        }
      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Games 5 & 6: Add and Take Away — single-digit sums shown with pictures
  // ---------------------------------------------------------------------
  //  Add:       two groups of lemmings walk in, "3 + 2 = ?", groups join on a right answer.
  //  Take Away: Grizzly's honey pots appear, lemmings run off with some, "5 − 2 = ?".
  function makeMathGame(mode) {
    const ADD = mode === 'add';
    const ROUNDS = 5;
    const ADD_MAX_SUM = [5, 6, 8, 10, 10];                      // answers never go above 10
    const SUB_START = [[3, 5], [4, 6], [5, 7], [6, 9], [7, 9]]; // how many pots to start with
    const CHOICE_X = [400, 560, 720], CHOICE_Y = 252, CHOICE_R = 50;
    const COLOR = ADD ? '#4caf50' : '#ff8c42', INK = ADD ? '#2e7d32' : '#b85a12';
    const SPACING = ADD ? 64 : 72, PLUS_GAP = 96, CENTER = 560;
    let round = 0, a = 0, b = 0, answer = 0, phase = 'intro', timer = 0, tapN = 0, plusX = 0, plusAlpha = 1, puzzledT = 0;
    let items = [], thieves = [], choices = [], wrong = new Set();

    function jump(it) { if (it.jy === 0) it.jv = -320; }

    function newRound() {
      if (ADD) {
        const sum = randInt(2, ADD_MAX_SUM[round]);
        a = randInt(1, sum - 1); b = sum - a; answer = sum;
      } else {
        const [lo, hi] = SUB_START[round];
        a = randInt(lo, hi); b = randInt(1, Math.min(a - 1, 4)); answer = a - b;
      }
      items = []; thieves = []; tapN = 0; wrong = new Set(); plusAlpha = 1; puzzledT = 0;
      choices = pickChoices(answer, 0, 10);
      phase = 'intro';
      const base = { jy: 0, jv: 0, num: 0, hop: 0 };
      if (ADD) {
        const width = (a - 1) * SPACING + PLUS_GAP + (b - 1) * SPACING;
        const x0 = CENTER - width / 2;
        plusX = x0 + (a - 1) * SPACING + PLUS_GAP / 2;
        for (let i = 0; i < a; i++) {
          const tx = x0 + i * SPACING;
          items.push(Object.assign({ group: 0, tx, x: tx - 700, color: '#e8a35c', dir: 1, step: rand(0, 6), seed: rand(0, 10) }, base));
        }
        for (let j = 0; j < b; j++) {
          const tx = plusX + PLUS_GAP / 2 + j * SPACING;
          items.push(Object.assign({ group: 1, tx, x: tx + 700, color: '#f5e6c8', dir: -1, step: rand(0, 6), seed: rand(0, 10) }, base));
        }
      } else {
        const x0 = CENTER - (a - 1) * SPACING / 2;
        for (let i = 0; i < a; i++) items.push(Object.assign({ x: x0 + i * SPACING, pop: -i * 0.12, gone: false }, base));
        timer = 1.6 + a * 0.12;
        say(`Grizzly has ${a} honey pots.`, true);
      }
    }

    return {
      start() { round = 0; newRound(); },
      update(dt) {
        for (const it of items) {
          if (ADD) {
            it.step += dt * 14;
            const d = it.tx - it.x;
            if (Math.abs(d) > 1) { it.x += Math.sign(d) * Math.min(Math.abs(d), 380 * dt); it.hop = Math.abs(Math.sin(it.step)) * 5; }
            else { if (it.hop) puff(it.x - it.dir * 15, GROUND, 3, 40); it.x = it.tx; it.hop = 0; } // skid to a stop
          } else {
            it.pop = Math.min(1, it.pop + dt * 3);
          }
          updateHop(it, dt);
        }
        for (const t of thieves) {
          t.step += dt * 14;
          if (t.state === 'in') {

  // ---------------------------------------------------------------------
  //  Lemming Sudoku — a 4 x 4 grid of treats. Every row, column and 2 x 2
  //  box needs one honey, apple, berries and fish. Pick a treat from the
  //  palette, then tap a square. 4 puzzles with more empty squares each time.
  // ---------------------------------------------------------------------
  S.sudoku = (() => {
    const SYMBOLS = ['honey', 'apple', 'berries', 'fish'];
    const NAMES = ['Honey', 'Apple', 'Berries', 'Fish'];
    const FIT = v => SYMBOLS[v] === 'fish' ? 0.76 : 1; // the fish is wider than the others
    const BLANKS = [4, 6, 8, 10];                 // empty squares per puzzle
    const CS = 90, X0 = 300, Y0 = 92;             // cell size and grid corner
    const PAL_X = 790, PAL_Y = [150, 245, 340, 435], PAL_R = 42;
    let puzzle = 0, cells = [], selected = 0, phase = 'play', timer = 0, puzzledT = 0;
    const fans = [
      { x: 52, color: '#e8a35c', seed: 1.3, jy: 0, jv: 0 },
      { x: 238, color: '#f5e6c8', seed: 4.1, jy: 0, jv: 0 },
    ];

    // A valid solution: shuffle rows within bands, bands, columns within stacks, stacks, and the symbols.
    function makeSolution() {
      const base = [[0, 1, 2, 3], [2, 3, 0, 1], [1, 0, 3, 2], [3, 2, 1, 0]];
      const order = () => { const out = []; shuffle([0, 1]).forEach(b => shuffle([0, 1]).forEach(k => out.push(b * 2 + k))); return out; };
      const rows = order(), cols = order(), sym = shuffle([0, 1, 2, 3]);
      return rows.map(r => cols.map(c => sym[base[r][c]]));
    }
    function fits(g, r, c, v) {
      for (let i = 0; i < 4; i++) if (g[r][i] === v || g[i][c] === v) return false;
      const br = r - r % 2, bc = c - c % 2;
      for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) if (g[br + i][bc + j] === v) return false;
      return true;
    }
    // Number of ways to finish g (stops counting at 2).
    function countSolutions(g) {
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        if (g[r][c] !== -1) continue;
        let n = 0;
        for (let v = 0; v < 4 && n < 2; v++) {
          if (!fits(g, r, c, v)) continue;
          g[r][c] = v; n += countSolutions(g); g[r][c] = -1;
        }
        return n;
      }
      return 1;
    }
    // Blank squares one at a time, keeping only blanks that leave exactly one answer.
    function makePuzzle(nBlanks) {
      for (let attempt = 0; attempt < 30; attempt++) {
        const sol = makeSolution(), g = sol.map(row => row.slice());
        let blanks = 0;
        for (const k of shuffle([...Array(16).keys()])) {
          if (blanks === nBlanks) break;
          const r = k >> 2, c = k % 4, keep = g[r][c];
          g[r][c] = -1;
          if (countSolutions(g) === 1) blanks++; else g[r][c] = keep;
        }
        if (blanks === nBlanks) return { sol, g };
      }
      return null;
    }
    function newPuzzle() {
      const { sol, g } = makePuzzle(BLANKS[puzzle]);
      cells = [];
      for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
        cells.push({ r, c, sol: sol[r][c], val: g[r][c], given: g[r][c] !== -1, flash: 0, shake: 0, pop: 0 });
      }
      phase = 'play'; puzzledT = 0;
      say(puzzle === 0 ? 'Pick a treat, then tap a square.' : `Puzzle ${puzzle + 1}!`, true);
    }
    const cellAt = (r, c) => cells[r * 4 + c];
    function oops(cell, words) {
      cell.shake = 0.35; puzzledT = 1.5;
      sfx.nope(); say(words);
    }
    function place(cell) {
      const v = selected;
      const clashes = cells.filter(o => o !== cell && o.val === v &&
        (o.r === cell.r || o.c === cell.c || (o.r >> 1 === cell.r >> 1 && o.c >> 1 === cell.c >> 1)));
      if (clashes.length) {
        clashes.forEach(o => { o.flash = 0.9; });
        oops(cell, `Oops! There's already ${NAMES[v].toLowerCase()} there.`);
        return;
      }
      if (v !== cell.sol) { oops(cell, 'Hmm, not that one. Try another treat!'); return; }
      cell.val = v; cell.pop = 0.3;
      sfx.pop(); tone(660 + v * 110, 0.12, 'triangle', 0.1);
      if (cells.every(o => o.val === o.sol)) {
        phase = 'solved'; timer = 2.8;
        sfx.yay(); say('You solved it!');
        burst(X0 + CS * 2, Y0 + CS * 2, '#ffd93d', 24);
        fans.forEach(f => { f.jv = -340; });
      }
    }

    return {
      start() { puzzle = 0; selected = 0; newPuzzle(); },
      update(dt) {
        for (const o of cells) {
          o.flash = Math.max(0, o.flash - dt); o.shake = Math.max(0, o.shake - dt); o.pop = Math.max(0, o.pop - dt);
        }
        fans.forEach(f => updateHop(f, dt));
        puzzledT = Math.max(0, puzzledT - dt);
        if (overlay) return;
        if (phase === 'solved') {
          if (Math.random() < 0.06) { const f = pick(fans); if (f.jy === 0) f.jv = -320; }
          timer -= dt;
          if (timer <= 0) {
            puzzle++;
            if (puzzle >= BLANKS.length) { phase = 'done'; celebrate('sudoku', 'Sudoku star!', 'You solved every puzzle!'); }
            else newPuzzle();
          }
        }
      },
      render() {
        drawBackground();
        const solved = phase === 'solved' || phase === 'done';
        drawBear(145, GROUND, 0.8, { pose: puzzledT > 0 ? 'scratch' : undefined, dance: solved, look: 1 });
        fans.forEach(f => drawLemmingAt(f.x, GROUND + f.jy, 1.4, { color: f.color, seed: f.seed, squash: hopSquash(f), face: solved ? 'happy' : undefined }));

        // board
        const LINE = '#0f8479';
        panel(X0 - 14, Y0 - 14, CS * 4 + 28, CS * 4 + 28, 24, solved ? '#fff0b8' : P.cream, { depth: 7, rim: 4, rimColor: LINE, edge: '#0b6b62' });
        for (const o of cells) {
          const x = X0 + o.c * CS + (o.shake ? Math.sin(o.shake * 50) * 5 : 0), y = Y0 + o.r * CS;
          ctx.fillStyle = o.given ? '#f1dcb0' : hot(x, y, CS, CS) && o.val === -1 && phase === 'play' ? '#fff0c8' : '#fffdf6';
          ctx.fillRect(x, y, CS, CS);
          if (o.flash > 0) { ctx.globalAlpha = 0.55 * Math.abs(Math.sin(o.flash * 10)); ctx.fillStyle = '#ff6b6b'; ctx.fillRect(x, y, CS, CS); ctx.globalAlpha = 1; }
          if (o.val !== -1) {
            const s = 1.9 * FIT(o.val) * (1 + o.pop * 1.2) * (solved ? 1 + Math.sin(time * 6 + o.r + o.c) * 0.06 : 1);
            drawTreat(SYMBOLS[o.val], x + CS / 2, y + CS / 2 + 2, 0, s);
          }
        }
        // thin lines between squares, thick lines around each 2 x 2 box
        for (let i = 1; i < 4; i++) {
          const thick = i === 2;
          ctx.lineWidth = thick ? 5 : 2; ctx.strokeStyle = thick ? LINE : 'rgba(15,132,121,.3)';
          ctx.beginPath(); ctx.moveTo(X0 + i * CS, Y0); ctx.lineTo(X0 + i * CS, Y0 + CS * 4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(X0, Y0 + i * CS); ctx.lineTo(X0 + CS * 4, Y0 + i * CS); ctx.stroke();
        }
        ctx.lineWidth = 5; ctx.strokeStyle = LINE; ctx.lineJoin = 'round'; ctx.strokeRect(X0, Y0, CS * 4, CS * 4);

        // treat palette
        SYMBOLS.forEach((t, i) => {
          const sel = i === selected, y = PAL_Y[i];
          ctx.save(); ctx.translate(PAL_X, y); const k = sel ? 1.12 + Math.sin(time * 5) * 0.03 : 1; ctx.scale(k, k);
          circle(0, 9, PAL_R, P.shadow);
          circle(0, 5, PAL_R, dark(P.cream, 0.34));
          solid(ell(0, 0, PAL_R, PAL_R), sel ? '#fff0b8' : P.cream, { depth: 0, rim: 2.5 });
          if (sel) { ctx.lineWidth = 7; ctx.strokeStyle = P.honey; ctx.beginPath(); ctx.arc(0, 0, PAL_R + 6, 0, Math.PI * 2); ctx.stroke(); }
          drawTreat(t, 0, 2, 0, 1.6 * FIT(i));
          ctx.restore();
        });
        drawRoundStars(puzzle + (phase === 'done' ? 1 : 0), BLANKS.length);
      },
      pointer(p) {
        if (phase !== 'play') return;
        const pi = PAL_Y.findIndex(y => Math.hypot(p.x - PAL_X, p.y - y) < PAL_R + 10);
        if (pi >= 0) { selected = pi; sfx.flip(); say(NAMES[pi]); return; }
        if (p.x < X0 || p.x >= X0 + CS * 4 || p.y < Y0 || p.y >= Y0 + CS * 4) return;
        const cell = cellAt(Math.floor((p.y - Y0) / CS), Math.floor((p.x - X0) / CS));
        if (cell.given) { cell.shake = 0.2; sfx.plop(); return; }
        if (cell.val !== -1) { cell.val = -1; sfx.plop(); puff(X0 + cell.c * CS + CS / 2, Y0 + cell.r * CS + CS * 0.8, 4, 40); return; }

      },
    };
  })();

  // ---------------------------------------------------------------------
  //  Jigsaw — drag the pieces of a picture back into its frame.
  //  Each round shows the whole picture for a moment, then the pieces slide
  //  out to the trays at the sides. A piece dropped on its own place snaps
  //  in; dropped anywhere else it glides back to its tray.
  //  3 pictures: 2 x 2 pieces over a faint copy of the picture, 3 x 2 over
  //  a fainter one, then 3 x 3 with grid lines only.
  //  Each picture is painted once into its own canvas and cut into piece
  //  images, so a frame only has to draw a handful of images.
  // ---------------------------------------------------------------------
  const jigsawW = 420, jigsawH = 300;              // the size of every picture
  // Paint something once into its own canvas: pxW x pxH screen pixels, showing w x h of game space.
  function jigsawLayer(pxW, pxH, w, h, paint) {
    const layer = document.createElement('canvas');
    layer.width = Math.max(1, pxW); layer.height = Math.max(1, pxH);
    const main = ctx, now = time;
    ctx = layer.getContext('2d');
    ctx.setTransform(layer.width / w, 0, 0, layer.height / h, 0, 0);
    time = 2;                                      // a fixed moment, so nobody is painted in the middle of a blink
    try { paint(); } finally { ctx = main; time = now; }
    return layer;
  }
  function jigsawFlower(x, y, color, s = 1) {
    ctx.strokeStyle = '#3f9e58'; ctx.lineWidth = 2.5 * s; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y + 13 * s); ctx.lineTo(x, y); ctx.stroke();
    for (let k = 0; k < 5; k++) circle(x + Math.cos(k * 1.257 + x) * 5.5 * s, y + Math.sin(k * 1.257 + x) * 5.5 * s, 4.6 * s, color);
    circle(x, y, 3.6 * s, P.honey);
  }
  // A rolling hill: a curve through (0, y0) and (w, y1), filled down to the bottom of the picture.
  function jigsawHill(y0, c1y, c2y, y1, color) {
    const p = new Path2D();
    p.moveTo(-4, y0); p.bezierCurveTo(jigsawW * 0.3, c1y, jigsawW * 0.62, c2y, jigsawW + 4, y1);
    p.lineTo(jigsawW + 4, jigsawH + 4); p.lineTo(-4, jigsawH + 4); p.closePath();
    ctx.fillStyle = color; ctx.fill(p);
  }
  // The meadow in front: a scalloped grass edge at y, then grass to the bottom.
  function jigsawGrass(y, edge, grass, band) {
    ctx.fillStyle = edge;
    for (let x = -8; x < jigsawW + 20; x += 24) { ctx.beginPath(); ctx.arc(x, y + 9, 16, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = grass; ctx.fillRect(0, y + 9, jigsawW, jigsawH - y);
    ctx.fillStyle = band; ctx.fillRect(0, y + 9, jigsawW, 6);
  }

  // Picture 1: Grizzly with a pot of honey in the sunny meadow.

    }
    circle(58, 54, 30, P.honeyLight); circle(49, 45, 8, 'rgba(255,255,255,.4)');
    drawCloud(346, 56, 0.82); drawCloud(150, 26, 0.4);
    // hills and trees

    drawFir(128, 170, 0.5, '#71c094', '#5fb087'); drawFir(304, 178, 0.44, '#71c094', '#5fb087'); drawFir(160, 176, 0.36, '#71c094', '#5fb087');
    jigsawHill(212, 184, 236, 204, '#68bf6c');
    drawFir(44, 240, 1.05, '#34997a', '#278468'); drawFir(92, 232, 0.6, '#34997a', '#278468');
    drawRoundTree(380, 240, 1.05, '#58b96a');
    jigsawGrass(238, '#8bd870', P.grass, '#7fd167');
    [[24, 268, P.rose], [70, 280, '#ffffff'], [118, 262, P.honeyLight], [300, 264, '#c9a3ff'], [398, 276, P.rose], [276, 284, '#ffffff']]
      .forEach(([x, y, c]) => jigsawFlower(x, y, c));

    }
    // reeds on the left
    [[14, 150, 82], [30, 160, 64], [44, 148, 50]].forEach(([x, y, len]) => {

    // the lemmings, their berries, and a butterfly that has come to look

    drawTreat('fish', 44, 252, -0.9, 1.5);

    // a water lily, bottom right

    circle(384, 268, 4.5, P.honeyLight);

  // Picture 3: Grizzly asleep in his nightcap, under the moon.
  function jigsawPaintNight() {
    const w = jigsawW, h = jigsawH;
    const sky = ctx.createLinearGradient(0, 0, 0, 230);
    sky.addColorStop(0, '#1c2154'); sky.addColorStop(1, '#4c5aa8');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);

    }
    // a shooting star, top middle
    const tail = new Path2D();
    tail.moveTo(184, 30); tail.lineTo(250, 8); tail.lineTo(190, 38); tail.closePath();
    ctx.fillStyle = 'rgba(255,246,200,.45)'; ctx.fill(tail);
    drawSparkle(186, 34, 11, '#fff6c8');
    // the moon, top right
    circle(346, 56, 52, 'rgba(255,246,200,.14)');
    circle(346, 56, 34, '#fff3c4');
    circle(334, 47, 7.5, 'rgba(214,190,130,.55)'); circle(358, 67, 5.5, 'rgba(214,190,130,.55)'); circle(352, 42, 3, 'rgba(214,190,130,.55)');
    // dark hills and trees
    jigsawHill(188, 150, 214, 176, '#2f5d8c');
    drawFir(300, 184, 0.5, '#2a6f8a', '#235f7b'); drawFir(134, 180, 0.42, '#2a6f8a', '#235f7b');
    jigsawHill(214, 190, 238, 206, '#27677a');
    drawFir(40, 240, 1.05, '#1f7a70', '#18665f'); drawFir(88, 232, 0.62, '#1f7a70', '#18665f');
    drawFir(392, 238, 0.9, '#1f7a70', '#18665f'); drawFir(350, 232, 0.55, '#1f7a70', '#18665f');
    jigsawGrass(240, '#3c9a6c', '#2f8660', '#38936a');
    // fireflies
    [[22, 132], [60, 108], [112, 150], [318, 128], [384, 150], [296, 96], [150, 122]].forEach(([x, y]) => {
      circle(x, y, 8, 'rgba(255,240,150,.22)'); circle(x, y, 2.8, '#fff3a0');
    });
    // everyone is fast asleep
    drawLemmingAt(62, 288, 1.9, { color: LEMMING_COLORS[1], seed: 1, face: 'sleep' });
    drawBear(214, 290, 0.98, { pose: 'sleep' });
    drawLemmingAt(360, 290, 1.7, { color: LEMMING_COLORS[2], seed: 3, dir: -1, face: 'sleep' });
    [[132, 100, 22], [108, 68, 30], [74, 34, 40]].forEach(([x, y, size]) => text('z', x, y, size, '#fff6c8', '#1c2154'));
  }

  S.jigsaw = (() => {
    const BW = jigsawW, BH = jigsawH, BX = (W - BW) / 2, BY = 80, CORNER = 14;
    const ROUNDS = [
      { cols: 2, rows: 2, guide: 0.4, paint: jigsawPaintMeadow, start: 'Drag each piece back to its place.', cheer: 'You did it!' },
      { cols: 3, rows: 2, guide: 0.17, paint: jigsawPaintRiver, start: 'Now six pieces!', cheer: 'Well done!' },
      { cols: 3, rows: 3, guide: 0, paint: jigsawPaintNight, start: 'Now nine pieces!', cheer: 'Wonderful!' },
    ];
    const TRAYS = [{ x: 12, w: 234 }, { x: 714, w: 234 }], TRAY_Y = 66, TRAY_H = 462;
    let round = 0, wins = 0, pieces = [], held = null, phase = 'show', timer = 0, puzzledT = 0, flashT = 0, hint = null;
    let pw = 0, ph = 0, art = null;
    const finger = { x: 0, y: 0, ox: 0, oy: 0 };   // where the finger is, and how far the held piece's middle is from it
    const pals = [
      { x: 398, color: LEMMING_COLORS[0], seed: 1.3, dir: 1, jy: 0, jv: 0 },
      { x: 564, color: LEMMING_COLORS[2], seed: 4.1, dir: -1, jy: 0, jv: 0 },
    ];

    // The picture and its pieces, painted once per round (and again if the screen size changes).
    function getArt() {
      if (!canvas.width || !canvas.height) return null;
      const key = round + ':' + canvas.width + 'x' + canvas.height;
      if (art && art.key === key) return art;
      const R = ROUNDS[round], kx = canvas.width / W, ky = canvas.height / H;
      const picture = jigsawLayer(Math.round(BW * kx), Math.round(BH * ky), BW, BH, R.paint);
      const cut = [];
      for (let r = 0; r < R.rows; r++) for (let c = 0; c < R.cols; c++) {
        // cut along whole screen pixels, so each piece is an exact copy of its part of the picture
        const sx = Math.round(c * picture.width / R.cols), sy = Math.round(r * picture.height / R.rows);
        const sw = Math.round((c + 1) * picture.width / R.cols) - sx, sh = Math.round((r + 1) * picture.height / R.rows) - sy;
        const img = jigsawLayer(sw, sh, pw, ph, () => {
          const p = rr(0, 0, pw, ph, CORNER);
          ctx.save(); ctx.clip(p);
          if (sw > 0 && sh > 0) ctx.drawImage(picture, sx, sy, sw, sh, 0, 0, pw, ph);
          rimOf(p, 'rgba(60,20,70,.4)', 6);          // half of it shows inside the clip: a rim in a deeper tone of the picture
          ctx.restore();
          shadeEdge(p, 5);
        });
        cut.push({ img, sx, sy });
      }
      art = { key, picture, cut };
      return art;
    }
    // The middle of a piece's own place on the board.
    const cellX = pc => BX + (pc.c + 0.5) * pw, cellY = pc => BY + (pc.r + 0.5) * ph;

    function newRound() {
      const R = ROUNDS[round], n = R.cols * R.rows;
      pw = BW / R.cols; ph = BH / R.rows;
      // tray places: pieces alternate between the two trays, top to bottom, zigzagging when there is room
      const perTray = [Math.ceil(n / 2), Math.floor(n / 2)];
      pieces = shuffle([...Array(n).keys()]).map((id, i) => {
        const side = i % 2, slot = Math.floor(i / 2), m = perTray[side], tray = TRAYS[side];
        const step = m > 1 ? Math.min(ph + 14, (TRAY_H - 20 - ph) / (m - 1)) : 0;
        const top = TRAY_Y + (TRAY_H - ph - step * (m - 1)) / 2;
        const free = tray.w - 20 - pw, zig = free > 40 ? ((slot + side) % 2 ? 0.92 : 0.08) : 0.5;
        const pc = { id, c: id % R.cols, r: Math.floor(id / R.cols), tilt: rand(-0.06, 0.06), rot: 0, lift: 0,
          hx: tray.x + 10 + pw / 2 + free * zig + rand(-2, 2), hy: top + ph / 2 + slot * step + rand(-2, 2),
          placed: false, wait: 99, miss: 0, pop: 0 };
        pc.x = cellX(pc); pc.y = cellY(pc);
        return pc;
      });
      held = null; hint = null; phase = 'show'; timer = round === 0 ? 1.6 : 1.3; puzzledT = 0;
    }
    // The pieces leave the board for their trays, one after another.
    function scatter() {
      phase = 'play';
      pieces.forEach((pc, i) => { pc.wait = i * 0.07; });
      sfx.flip();
      say(ROUNDS[round].start, true);
    }
    function place(pc) {
      pc.placed = true; pc.pop = 0.35;
      sfx.catch();
      burst(cellX(pc), cellY(pc), P.honeyLight, 10);
      if (hint && hint.pc === pc) hint = null;
      if (!pieces.every(o => o.placed)) return;
      phase = 'solved'; timer = 2.8; flashT = 0.7; wins = round + 1;
      sfx.yay(); say(ROUNDS[round].cheer);
      [[BX, BY], [BX + BW, BY], [BX, BY + BH], [BX + BW, BY + BH]].forEach(([x, y]) => burst(x, y, '#ffd93d', 7));
      burst(W / 2, BY + BH / 2, '#ff5c8a', 8, 'heart');
      pals.forEach(f => { f.jv = -340; });
    }
    // The finger let go of the held piece.
    function drop() {
      const pc = held;
      held = null;
      pc.x = finger.x + finger.ox; pc.y = finger.y + finger.oy;
      if (Math.abs(pc.x - cellX(pc)) < pw * 0.55 && Math.abs(pc.y - cellY(pc)) < ph * 0.55) { place(pc); return; }
      // on the board but in the wrong place: a soft "try again"; the second time, its place lights up
      if (pc.x > BX - 8 && pc.x < BX + BW + 8 && pc.y > BY - 8 && pc.y < BY + BH + 8) {
        pc.miss++; puzzledT = 1.2;
        sfx.nope();
        if (pc.miss >= 2) { hint = { pc, t: 2.6 }; say('Look, it goes here!'); } else say('Try again!');
      }
    }

    function drawPiece(pc, a) {
      const kx = canvas.width / W, ky = canvas.height / H, cut = a.cut[pc.id];
      const w = cut.img.width / kx, h = cut.img.height / ky, s = 1 + pc.lift * 0.06;
      ctx.save();
      if (pc.placed && pc.x === cellX(pc) && pc.y === cellY(pc)) {
        // in its place: lined up with the picture to the exact screen pixel
        ctx.translate((Math.round(BX * kx) + cut.sx) / kx + w / 2, (Math.round(BY * ky) + cut.sy) / ky + h / 2);
      } else {
        ctx.translate(Math.round((pc.x - w / 2) * kx) / kx + w / 2, Math.round((pc.y - h / 2) * ky) / ky + h / 2);
        ctx.rotate(pc.rot);
        ctx.fillStyle = P.shadow; ctx.fill(rr(-w / 2 + pc.lift * 4, -h / 2 + 5 + pc.lift * 9, w, h, CORNER));
        ctx.scale(s, s);
      }
      ctx.drawImage(cut.img, -w / 2, -h / 2, w, h);
      if (pc.pop > 0) { ctx.globalAlpha = pc.pop / 0.35 * 0.7; ctx.fillStyle = '#fff'; ctx.fill(rr(-w / 2, -h / 2, w, h, CORNER)); ctx.globalAlpha = 1; }
      ctx.restore();
    }

    return {
      start() { round = 0; wins = 0; flashT = 0; newRound(); },
      update(dt) {
        puzzledT = Math.max(0, puzzledT - dt);
        flashT = Math.max(0, flashT - dt);
        if (hint && (hint.t -= dt) <= 0) hint = null;
        pals.forEach(f => updateHop(f, dt));
        // a drag that lost its finger (the window lost focus, say) lets the piece glide home
        if (held && !pointer.down) held = null;
        const ease = 1 - Math.exp(-dt * 14), snap = 1 - Math.exp(-dt * 28);
        for (const pc of pieces) {
          pc.pop = Math.max(0, pc.pop - dt);
          if (pc === held) {
            // the piece slides until its middle is under the finger
            finger.ox *= 1 - ease; finger.oy *= 1 - ease;
            pc.x = finger.x + finger.ox; pc.y = finger.y + finger.oy;
            pc.rot *= 1 - ease; pc.lift += (1 - pc.lift) * ease;
            continue;
          }
          pc.lift *= 1 - ease;
          if (pc.wait > 0) { pc.wait -= dt; continue; }
          const tx = pc.placed ? cellX(pc) : pc.hx, ty = pc.placed ? cellY(pc) : pc.hy, tr = pc.placed ? 0 : pc.tilt;
          const e = pc.placed ? snap : ease;
          pc.x += (tx - pc.x) * e; pc.y += (ty - pc.y) * e; pc.rot += (tr - pc.rot) * e;
          if (Math.abs(tx - pc.x) + Math.abs(ty - pc.y) < 0.5) { pc.x = tx; pc.y = ty; pc.rot = tr; }
        }
        if (overlay) return;
        if (phase === 'show') {
          timer -= dt;
          if (timer <= 0) scatter();
        } else if (phase === 'solved') {
          if (Math.random() < 0.05) { const f = pick(pals); if (f.jy === 0) f.jv = -300; }
          timer -= dt;
          if (timer <= 0) {
            if (round + 1 >= ROUNDS.length) { phase = 'done'; celebrate('jigsaw', 'Puzzle champ!', 'You finished every picture!'); }
            else { round++; newRound(); }
          }
        }
      },
      render() {
        drawBackground();
        const R = ROUNDS[round], a = getArt(), done = phase === 'solved' || phase === 'done';
        const kx = canvas.width / W, ky = canvas.height / H;
        const bx = Math.round(BX * kx) / kx, by = Math.round(BY * ky) / ky;   // the picture's corner, on a whole screen pixel

        TRAYS.forEach(t => panel(t.x, TRAY_Y, t.w, TRAY_H, 28, '#fff0e6', { depth: 5, rimColor: '#edb3a6', edge: '#e3a091' }));

        // the frame, the board inside it, a faint copy of the picture, and the grid
        const frame = done ? mixColor(P.honey, P.honeyLight, 0.5 + 0.5 * Math.sin(time * 7)) : P.wood;
        panel(BX - 14, BY - 14, BW + 28, BH + 28, 22, frame, { depth: 7, rim: 3.5, rimColor: dark(P.wood, 0.36), edge: dark(P.wood, 0.36) });
        ctx.fillStyle = P.cream; ctx.fill(rr(BX - 3, BY - 3, BW + 6, BH + 6, 8));
        if (a && R.guide) { ctx.globalAlpha = R.guide; ctx.drawImage(a.picture, bx, by, a.picture.width / kx, a.picture.height / ky); ctx.globalAlpha = 1; }
        ctx.save();
        ctx.setLineDash([7, 7]); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(155,98,56,.42)';
