  // =====================================================================

  let L = null;

        const s = k * (b.kind === 'far' ? 0.38 + hash(t + 9) * 0.18 : 0.55 + hash(t + 19) * 0.25);

  // =====================================================================

  let clouds = [], birds = [], balloon = null, fireflies = [], flowers = [], butterflies = [];
  function makeWorldThings() {
    const cs = clamp(Math.min(W, H) / 640, 0.55, 1.3), skyBottom = L.horizon;
    const n = Math.ceil(W / 300) + 2;
    clouds = [];
    for (let i = 0; i < n; i++) clouds.push({ x: rand(-100, W + 100), y: rand(SAFE.t + 50 * cs, Math.max(SAFE.t + 80 * cs, skyBottom - 60 * cs)), s: cs * rand(0.6, 1.1), v: rand(5, 13) * cs });
    birds = [];
    for (let i = 0; i < 4; i++) birds.push({ x: rand(0, W), y: rand(SAFE.t + 70, skyBottom * 0.7), v: rand(28, 46) * cs, s: cs * rand(0.7, 1), seed: rand(0, 9) });

    for (let i = 0; i < 16; i++) fireflies.push({ x: rand(0, W), y: rand(L.horizon, H), seed: rand(0, 99) });

    flowers = [];
    const fl = Math.ceil(W / 34);

    for (let i = 0; i < fl * (L.land ? 1 : 2); i++) {
      const x = hash(i * 3.3 + 1) * W;
      let y;

  // ---- Sky clock: morning (0) → night (1) as today's play time is used up ----
  const SKY = [[0, '#63c2f0', '#d6f3ff'], [0.55, '#4fb1ea', '#c4ecff'], [0.8, '#f58a6e', '#ffd9a3'], [1, '#1c2154', '#3f4b92']];
  function skyAt(phase) {
    let i = 0;
    while (i < SKY.length - 2 && phase > SKY[i + 1][0]) i++;
    const [p0, top0, bot0] = SKY[i], [p1, top1, bot1] = SKY[i + 1];
    const t = clamp01((phase - p0) / (p1 - p0));

  }
  const starField = Array.from({ length: 60 }, (_, i) => ({ x: hash(i + 1), y: hash(i + 101), r: 2.5 + hash(i + 201) * 3, tw: hash(i + 301) * 6 }));
  function drawSky(phase) {
    const [skyTop, skyBottom] = skyAt(phase);

    const evening = clamp01((phase - 0.55) / 0.25) * (1 - night);
    const g = ctx.createLinearGradient(0, 0, 0, L.horizon + 40);
    g.addColorStop(0, skyTop); g.addColorStop(1, skyBottom);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const cs = clamp(Math.min(W, H) / 640, 0.6, 1.4);
    const sunX = W * (L.land ? 0.86 : 0.8), sunTop = SAFE.t + (L.land ? 120 : 150) * cs;
    if (night > 0) {
      ctx.globalAlpha = night;
      const showMoon = !(state.screen === 'sleep' && !L.land);
      for (const s of starField) {
        const y = s.y * (L.horizon - 20);
        drawSparkle(s.x * W, y, (s.r + Math.sin(time * 2.5 + s.tw) * 1.3) * cs, '#fff6c8');
      }
      const mx = W * (L.land ? 0.87 : 0.84), my = sunTop + (L.land ? 40 : 70) * cs, mr = 34 * cs;
      if (showMoon) { circle(mx, my, mr * 2.1, 'rgba(255,246,200,.08)'); circle(mx, my, mr * 1.5, 'rgba(255,246,200,.14)'); }
      const cut = new Path2D(); cut.rect(0, 0, W, H); cut.arc(mx + mr * 0.42, my - mr * 0.26, mr * 0.84, 0, Math.PI * 2, true);
      if (showMoon) { ctx.save(); ctx.clip(cut, 'evenodd'); circle(mx, my, mr, '#fff3c4'); ctx.restore(); }  // a crescent moon
      ctx.globalAlpha = 1;
    }
    if (night < 1) {
      const sy = sunTop + clamp01((phase - 0.35) / 0.65) * (L.horizon - sunTop);
      const sun = mixColor(P.honeyLight, '#ff8a3d', clamp01((phase - 0.5) / 0.3));
      const r = 40 * cs;
      ctx.globalAlpha = 1 - night;
      circle(sunX, sy, r * 1.85, 'rgba(255,255,255,.14)'); circle(sunX, sy, r * 1.42, 'rgba(255,255,255,.2)');
      ctx.strokeStyle = sun; ctx.lineWidth = 7 * cs; ctx.lineCap = 'round';

        const a = i / 12 * Math.PI * 2 + time * 0.25;

  // =====================================================================
  //  The three places. Each is drawn in its own local box on a round paper "stage".
  // =====================================================================
  const placeAnim = {};
  ORDER.forEach(k => { placeAnim[k] = { sq: 0, sqV: 0, press: 0, party: 0 }; });
  const bus = { dist: 0, v: 70, t: 0, kneel: 0, door: 0 };
  const train = { t: 0, x: 999, door: 0, line: 0 };
  const lemmings = [
    { x: -128, y: 12, dir: 1, color: '#f2b866', seed: 1, hop: 0, vy: 0, sq: 0, next: 1.2 },
    { x: -74, y: 30, dir: 1, color: '#fff0d2', seed: 2.6, hop: 0, vy: 0, sq: 0, next: 2.3 },
    { x: 84, y: 28, dir: -1, color: '#e9944f', seed: 4.1, hop: 0, vy: 0, sq: 0, next: 0.6 },
    { x: 136, y: 8, dir: -1, color: '#d07b42', seed: 5.3, hop: 0, vy: 0, sq: 0, next: 3.1 },

  let bear = { wave: 0, next: 3 };
  let spotlight = 0, spotT = 0;

  function updatePlaces(dt, asleep) {
    for (const key of ORDER) {
      const a = placeAnim[key];
      const target = a.press ? 0.35 : 0;
      a.sqV += ((target - a.sq) * 180 - a.sqV * 12) * dt;
      a.sq += a.sqV * dt;
      a.party = Math.max(0, a.party - dt);
    }
    if (!asleep) { spotT += dt; if (spotT > 4.2) { spotT = 0; spotlight = (spotlight + 1) % 3; } }
    // the bus drives, slows down for its stop, kneels, opens its doors, and drives on
    if (asleep) { bus.v = 0; bus.door = Math.max(0, bus.door - dt); bus.kneel = lerp(bus.kneel, 3, dt * 2); }
    else {
      bus.t = (bus.t + dt) % 9.5;
      const t = bus.t, party = placeAnim.bus.party > 0;
      let v = 0;
      if (t < 4) v = 1; else if (t < 5.2) v = 1 - easeOut((t - 4) / 1.2); else if (t < 7.6) v = 0; else if (t < 8.8) v = easeIn((t - 7.6) / 1.2) * 0.4 + (t - 7.6) / 1.2 * 0.6; else v = 1;
      if (party) v = Math.max(v, 1.4);
      bus.v = v * 70;
      const stopped = t > 5.2 && t < 7.6 && !party;
      bus.kneel = lerp(bus.kneel, stopped ? 3.5 : 0, dt * 4);
      bus.door = clamp01(bus.door + (stopped && t > 5.6 && t < 7.2 ? dt * 2.5 : -dt * 2.5));
    }
    bus.dist += bus.v * dt;
    // the train glides into the station, opens its doors, and glides out
    if (asleep) { train.x = 0; train.door = Math.max(0, train.door - dt); }
    else {
      train.t += dt * (placeAnim.mrt.party > 0 ? 1.6 : 1);
      if (train.t > 11.5) { train.t = 0; train.line = (train.line + 1) % LINE_COLORS.length; }
      const t = train.t;
      if (t < 3.2) train.x = 430 * (1 - easeOut(t / 3.2));
      else if (t < 6.6) train.x = 0;
      else if (t < 9.2) train.x = -430 * easeIn((t - 6.6) / 2.6);
      else train.x = 999;
      train.door = clamp01(train.door + (t > 3.6 && t < 6.2 ? dt * 2.2 : -dt * 2.2));
    }
    // lemmings hop now and then (and a lot during a party)
    for (const m of lemmings) {
      if (asleep) { m.hop = 0; m.sq = Math.sin(time * 1.6 + m.seed) * 0.04; continue; }
      m.next -= dt;
      if (m.hop === 0 && m.vy === 0 && m.next <= 0) { m.vy = placeAnim.grizzly.party > 0 ? 260 : 190; m.next = placeAnim.grizzly.party > 0 ? 0.25 : rand(1.5, 4); m.sq = -0.15; }

        m.vy -= 900 * dt; m.hop += m.vy * dt;
        if (m.hop <= 0) { m.hop = 0; m.vy = 0; m.sq = 0.25; }
      }
      m.sq *= Math.pow(0.002, dt);
    }
    bear.next -= dt;
    if (bear.next <= 0) { bear.wave = 1.6; bear.next = rand(4, 7); }
    bear.wave = Math.max(0, bear.wave - dt);

  // The round paper stage every place stands on.

  // =====================================================================
  //  Particles (stars, hearts, sparkles, Zzz, puffs)
  // =====================================================================
  let particles = [];
  function burst(place, x, y, n, kinds) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(120, 320);
      particles.push({ place, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120, life: rand(0.8, 1.3), max: 1.3, g: 380,
        kind: kinds[i % kinds.length], color: ['#ff6b5c', '#ffd45c', '#6fc45a', '#5d9df7', '#c77dff', '#ff8fab'][i % 6], size: rand(7, 13), rot: rand(0, 6) });
    }
  }
  function updateParticles(dt) {
    for (const p of particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
      if (p.kind === 'z') p.vx = Math.sin(p.life * 2) * 14;
      if (p.kind === 'puff') { p.size += dt * 10; }
      p.rot = (p.rot || 0) + dt * 3;
    }
    particles = particles.filter(p => p.life > 0);
  }
  function drawParticle(p) {
    const a = clamp01(p.life / p.max * 1.5);
    ctx.globalAlpha = a;
    if (p.kind === 'star') drawStar(p.x, p.y, p.size, p.color);
    else if (p.kind === 'heart') drawHeart(p.x, p.y, p.size, '#ff6b8a');
    else if (p.kind === 'sparkle') drawSparkle(p.x, p.y, p.size, '#fff8d0');
    else if (p.kind === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore(); }
    else if (p.kind === 'puff') circle(p.x, p.y, p.size, 'rgba(255,255,255,.7)');
    else if (p.kind === 'z') text('z', p.x, p.y, p.size, '#fff6c8', 'rgba(40,40,100,.5)', 'center', 700);
    ctx.globalAlpha = 1;
  }
  function drawParticlesFor(place) { for (const p of particles) if (p.place === place && p.kind !== 'z') drawParticle(p); }
  function drawZs() {
    for (const key of ORDER) {
      const pl = L.places[key];
      ctx.save(); ctx.translate(pl.x, pl.y); ctx.scale(pl.k, pl.k);
      for (const p of particles) if (p.place === key && p.kind === 'z') drawParticle(p);
      ctx.restore();
    }
  }

  // =====================================================================

      const g = L.places.grizzly;
      butterflies.forEach((bf, i) => {
        const x = g.x + Math.sin(time * 0.7 + bf.seed) * 170 * g.k, y = g.y - (150 + Math.sin(time * 1.3 + bf.seed * 2) * 50) * g.k;
        drawButterfly(x, y, g.k * 1.1, bf.col, bf.seed);
      });
    }
    drawTints(tod);
    drawZs();
    if (tod.night > 0.3) {
      ctx.globalAlpha = clamp01((tod.night - 0.3) / 0.4);
      for (const f of fireflies) {
        const x = f.x + Math.sin(time * 0.5 + f.seed) * 30, y = f.y + Math.cos(time * 0.7 + f.seed) * 20;
        const tw = (Math.sin(time * 3 + f.seed) + 1) / 2;
        circle(x, y, 7 * L.k, `rgba(255,240,140,${0.15 * tw})`); circle(x, y, 2.6 * L.k, `rgba(255,246,170,${0.5 + 0.5 * tw})`);
      }
      ctx.globalAlpha = 1;
    }
    // night-time window glow drawn after the tint so it stays warm
    return tod;
  }
  // little extras for the empty meadow in tall layouts: a duck pond and a beehive tree
  function drawProp(pr, asleep) {
    ctx.save(); ctx.translate(pr.x, pr.y); ctx.scale(pr.s, pr.s);
    if (pr.kind === 'pond') {
      ellipse(0, 4, 112, 30, 'rgba(40,60,50,.14)');
      const pond = ell(0, 0, 104, 26);
      solid(pond, '#7fc8e8', { depth: 0, rim: 4, rimColor: '#e9dcc0' });
      ctx.save(); ctx.clip(pond);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) { const r = Math.max(0.1, (time * 18 + i * 22) % 66); ctx.globalAlpha = 1 - r / 66; ctx.beginPath(); ctx.ellipse(-30, 2, r, r * 0.26, 0, 0, Math.PI * 2); ctx.stroke(); }
      ctx.globalAlpha = 1;
      ctx.restore();
      [[50, -4], [62, 8], [-70, 6]].forEach(([x, y], i) => { solid(ell(x, y, 13, 5), '#58b96a', { depth: 0, rim: 1.5 }); if (i === 0) circle(x + 3, y - 3, 3.5, P.rose); });
      // a paper duck bobbing round the pond
      const dx = -30 + Math.sin(time * 0.5) * 40, dy = Math.sin(time * 2) * 1.5, f = Math.cos(time * 0.5) > 0 ? 1 : -1;
      ctx.save(); ctx.translate(dx, dy - 2); ctx.scale(f, 1);
      solid(ell(0, -6, 15, 9), '#fff6e0', { depth: 3, rim: 2, rimColor: '#e0cfa8' });
      solid(ell(10, -18, 8, 8), '#fff6e0', { depth: 2, rim: 2, rimColor: '#e0cfa8' });
      ctx.fillStyle = P.honey; ctx.beginPath(); ctx.moveTo(16, -19); ctx.lineTo(24, -17); ctx.lineTo(16, -14); ctx.fill();
      if (asleep) { inkLine(1.6); ctx.beginPath(); ctx.arc(12, -20, 2, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); } else circle(12, -20, 1.8, INK);
      ctx.restore();
      [-90, -82, 92].forEach((x, i) => { ctx.strokeStyle = '#4f9a50'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x + 3, -30 - i * 6); ctx.stroke(); solid(ell(x + 3, -32 - i * 6, 3.5, 8), '#9b6238', { depth: 0, rim: 0 }); });
    } else {
      drawRoundTree(0, 10, 1.6, '#4fae5e');
      circle(-30, -112, 6, '#ff6b5c'); circle(24, -90, 6, '#ff6b5c'); circle(6, -140, 6, '#ff6b5c');
      // a beehive hanging from a branch, with a bee or two buzzing round
      ctx.strokeStyle = P.woodDark; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(30, -84); ctx.lineTo(30, -70); ctx.stroke();
      const hive = new Path2D(); hive.ellipse(30, -54, 15, 19, 0, 0, Math.PI * 2);
      ctx.fillStyle = P.honey; ctx.fill(hive);
      ctx.save(); ctx.clip(hive); ctx.fillStyle = P.honeyDark; for (let y = -66; y < -36; y += 8) ctx.fillRect(10, y, 40, 2.5); ctx.restore();
      shadeEdge(hive, 4); rimOf(hive, dark(P.honey, 0.36), 2);
      circle(30, -44, 4, '#6b3e26');
      if (!asleep) for (let i = 0; i < 2; i++) {
        const a = time * (2 + i) + i * 3, bx = 30 + Math.cos(a) * (28 + i * 10), by = -54 + Math.sin(a * 1.3) * 18;
        ellipse(bx, by - 4, 4, 3, 'rgba(255,255,255,.8)');
        ellipse(bx, by, 5, 4, P.honeyLight); ctx.fillStyle = INK; ctx.fillRect(bx - 1, by - 4, 2, 8);
      }
      for (let i = 0; i < 3; i++) drawFlower(-40 + i * 34, 16 + (i % 2) * 6, 0.9, [P.rose, '#fff', '#c9a3ff'][i], i + 50);
    }
    ctx.restore();
  }
  function drawMeadowFlowers(y0, y1) {
    for (const f of flowers) if (f.y >= y0 && f.y < y1) drawFlower(f.x + parX * 0.9, f.y, f.s, f.col, f.i);
  }

  function render() {
    if (state.screen === 'game' && !trans) return;
    const cam = cameraFor();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buttons = [];
    if (cam.overGame) {                                // closing over the game: only the iris
      ctx.clearRect(0, 0, W, H);
      drawIris(cam.iris, cam.ix, cam.iy, false);
      return;
    }
    if (cam.iris === 0 && !cam.reveal) {
      drawIris(0, W / 2, H / 2, cam.loading);
      return;
    }
    if (cam.reveal) {                                  // opening onto the game
      ctx.clearRect(0, 0, W, H);
      drawIris(cam.iris, cam.ix, cam.iy, false);
      return;
    }
    const asleep = state.screen === 'sleep';
    ctx.save();
    if (cam.zoom !== 1) {
      ctx.translate(cam.fx, cam.fy); ctx.scale(cam.zoom, cam.zoom); ctx.translate(-cam.fx, -cam.fy);
    }
    drawWorld(asleep);
    // title, or the goodnight card
    if (asleep) drawSleepCard();
    else drawTitle("Let's Play!", L.title.x, L.title.y, L.title.size, skyPhase > 0.8);
    ctx.restore();
    if (!trans) drawTopBar(asleep);
    if (cam.iris !== null && cam.iris !== undefined) drawIris(cam.iris, cam.ix, cam.iy, false);
    if (modal) drawModal();
  }
  function drawSleepCard() {
    const size = L.title.size * 0.62;
    ctx.font = `700 ${size}px ${FONT}`;
    const w = Math.min(W - 40, ctx.measureText('Time to sleep!').width + size * 2.4), h = size * 2.3;
    const x = W / 2 - w / 2, y = L.title.y - h * 0.48;
    panel(x, y, w, h, Math.min(30, h * 0.3), P.cream, { depth: 7, rimColor: P.tan, edge: '#d9b57f' });
    // a little moon in the corner
    const mx = x + size * 0.9, my = y + h * 0.5, mr = size * 0.48;
    circle(mx, my, mr, '#ffd45c'); circle(mx + mr * 0.4, my - mr * 0.25, mr * 0.85, P.cream);
    text('Time to sleep!', W / 2 + size * 0.45, y + h * 0.36, size, INK, null, 'center', 700);
    text('See you tomorrow!', W / 2 + size * 0.45, y + h * 0.72, size * 0.62, P.honeyDark, null, 'center', 600);
  }

  // =====================================================================
  //  Main loop
  // =====================================================================
  let lastT = performance.now(), zT = 0;
  function update(dt) {
    time += dt;
    const asleep = state.screen === 'sleep';
    const target = asleep ? 1 : skyOverride !== null ? skyOverride : playTime.share();
    skyPhase += (target - skyPhase) * Math.min(1, dt * 1.5);
    if (state.screen !== 'game' || trans) {
      for (const c of clouds) { c.x += c.v * dt; if (c.x > W + 140) c.x = -140; }
      for (const b of birds) { b.x += b.v * dt; if (b.x > W + 60) { b.x = -60; b.y = rand(SAFE.t + 70, L.horizon * 0.7); } }
      if (balloon) { balloon.x += balloon.v * dt; if (balloon.x > W + 80) balloon.x = -80; }
      parX += (parTarget - parX) * Math.min(1, dt * 3);
      parTarget = Math.sin(time * 0.15) * 6;
      updatePlaces(dt, asleep);
      updateParticles(dt);
      if (asleep) {
        zT -= dt;
        if (zT <= 0) {
          zT = 0.9;
          const key = ORDER[randInt(0, 2)];
          const from = { bus: [-130, -110], grizzly: [24, -150], mrt: [-130, -200] }[key];
          particles.push({ place: key, x: from[0] + rand(-6, 6), y: from[1], vx: 0, vy: -32, life: 2.6, max: 2.6, kind: 'z', size: rand(22, 34) });
        }
      }
      if (time - starCacheT > 2 || starCacheT < 0) { starCacheT = time; ORDER.forEach(k => { starCache[k] = starsFor(k); }); }
    }
    if (modal && modal.shake > 0) modal.shake -= dt;
    updateTransition(dt);
    updateMusic();
  }
  function frameLoop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    try { update(dt); render(); } catch (e) { console.error(e); }
    requestAnimationFrame(frameLoop);
  }

  // Play-time counting runs on its own timer, so it is exact even when frames are slow.
  // It counts only while a game frame is showing, no grown-up panel is open and the page is visible.
  let countAcc = 0, countLast = performance.now();
  function countTick() {
    const now = performance.now(), dt = Math.min(2, (now - countLast) / 1000);
    countLast = now;
    const counting = state.screen === 'game' && !!frame && !modal && !trans && document.visibilityState === 'visible';
    if (counting) {
      countAcc += dt;
      while (countAcc >= 1) { countAcc -= 1; playTime.tick(); sendTime(); }
      if (playTime.left() <= 0) {
        overTime += dt;
        if (overTime >= FORCE_SLEEP_AFTER) closeGame('sleep');   // a game that never says goodnight is still stopped
      }
    }
    if (frame && now - lastSent > 1000) sendTime();
  }
  setInterval(countTick, 250);
  document.addEventListener('visibilitychange', () => { countLast = performance.now(); if (document.hidden) countAcc = Math.min(countAcc, 0.99); });

  // =====================================================================
  //  Input
  // =====================================================================
  function placeAt(x, y) {
    if (!L) return null;
    // nearest place whose box contains the point (boxes may overlap a little)
    let best = null, bestD = Infinity;
    for (const key of ORDER) {
      const b = L.places[key].box;
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
        const d = Math.abs(x - (b.x + b.w / 2)) + Math.abs(y - (b.y + b.h / 2)) * 0.5;
        if (d < bestD) { bestD = d; best = key; }
      }
    }
    return best;
  }
  function hitButton(x, y) {
    for (let i = buttons.length - 1; i >= 0; i--) {
      const b = buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b;
    }
    return null;
  }
  let pressedButton = null, pressedPlace = null;
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.down = true;
    pressedButton = hitButton(e.clientX, e.clientY);
    pressedPlace = null;
    if (pressedButton || modal || trans) return;
    if (state.screen === 'launcher' || state.screen === 'sleep') {
      pressedPlace = placeAt(e.clientX, e.clientY);
      if (pressedPlace) { placeAnim[pressedPlace].press = 1; sfx.pop(); }
    }
  });
  window.addEventListener('pointermove', e => { pointer.x = e.clientX; pointer.y = e.clientY;
    if (L && !pointer.down) parTarget = ((e.clientX / W) - 0.5) * -14; });
  window.addEventListener('pointerup', e => {
    initAudio(true);
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.down = false;
    ORDER.forEach(k => { placeAnim[k].press = 0; });
    if (pressedButton) {
      const b = hitButton(e.clientX, e.clientY);
      pressedButton = null;
      if (b) { sfx.click(); b.action(); }
      return;
    }
    if (pressedPlace) {
      const key = pressedPlace; pressedPlace = null;
      if (placeAt(e.clientX, e.clientY) === key) tapPlace(key);
    }
  });
  window.addEventListener('pointercancel', () => { pointer.down = false; pressedButton = null; pressedPlace = null; ORDER.forEach(k => { placeAnim[k].press = 0; }); });
  window.addEventListener('touchend', () => initAudio(true), { passive: true });
  window.addEventListener('click', () => initAudio(true));
  window.addEventListener('keydown', e => {
    initAudio(true);
    const k = e.key;
    if (modal) {
      e.preventDefault();
      if (k === 'Escape') closeModal();
      else if (/^[0-9]$/.test(k)) gateKey(k);
      else if (k === 'Backspace') gateKey('back');
      else if (k === 'Enter') gateKey('ok');
      return;
    }
    if (state.screen !== 'launcher' && state.screen !== 'sleep') return;
    if (k === 'ArrowLeft' || k === 'ArrowUp') { spotlight = (spotlight + 2) % 3; spotT = 0; sfx.pop(); }
    else if (k === 'ArrowRight' || k === 'ArrowDown') { spotlight = (spotlight + 1) % 3; spotT = 0; sfx.pop(); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); tapPlace(ORDER[spotlight]); }
    else if (k === '1' || k === '2' || k === '3') tapPlace(ORDER[Number(k) - 1]);
    else if (k === 'm' || k === 'M') { musicOn = !musicOn; save('hub-music', musicOn); }
  });

  // =====================================================================
  //  Setup
  // =====================================================================
  function resize() {
    W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    try {
      const r = document.getElementById('safe').getBoundingClientRect();
      SAFE.t = Math.max(0, r.top); SAFE.l = Math.max(0, r.left); SAFE.r = Math.max(0, W - r.right); SAFE.b = Math.max(0, H - r.bottom);
    } catch (e) { /* ignore */ }
    layout();
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { layerCache = {}; });
  if (playTime.left() <= 0) { state.screen = 'sleep'; songKey = 'sleep'; skyPhase = 1; }

  // Test hook
  window.__hub = {
    open(key) {
      if (!GAMES[key]) throw new Error('unknown game ' + key);
      if (state.screen === 'sleep' || playTime.left() <= 0) return false;
      if (state.screen !== 'launcher' || trans) return false;
      openGame(key, true); return true;
    },
    exit() { closeGame('exit'); },
    state() {
      return { screen: state.screen, frame: frame ? state.key : null, key: state.key, trans: trans ? trans.kind + ':' + trans.phase : null,
        modal: modal ? modal.mode : null, overTime, hello: state.hello || null };
    },
    playTime: { left: () => playTime.left(), used: () => playTime.used(), share: () => playTime.share(), get limit() { return playTime.limit; } },
    get modal() { return modal ? { mode: modal.mode, answer: modal.a * modal.b } : null; },
    layout() { return JSON.parse(JSON.stringify(L)); },
    buttons() { return buttons.map(b => ({ x: b.x, y: b.y, w: b.w, h: b.h })); },
    setUrl(key, url) { GAMES[key].url = url; },
    get frame() { return frame; },
    get audio() { return audio; },
    sky(phase) { skyOverride = phase; if (phase !== null) skyPhase = phase; },
  };
  requestAnimationFrame(frameLoop);
})();
</script>
</body>
</html>
